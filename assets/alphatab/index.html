<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >
  <title>Page-a-Diddle Piano Score</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #ffffff;
      --ink: #000000;
      --accent: #ff4800;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: var(--ink);
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }

    #alphaTab-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f2f2f2;
      touch-action: none;
    }

    #alphaTab-frame {
      position: relative;
      width: 794px;
      height: 1123px;
      background:
        repeating-linear-gradient(
          to bottom,
          #ffffff 0,
          #ffffff 1123px,
          #f2f2f2 1123px,
          #f2f2f2 1147px
        );
      transform-origin: top left;
      box-shadow: 0 0 0 1px #dddddd;
    }

    #alphaTab-frame.playback-follow {
      transition: transform 220ms ease-out;
    }

    #alphaTab-container {
      position: relative;
      width: 794px;
      min-height: 0;
      padding: 0;
      background: transparent;
    }

    .pad-measure-highlight {
      position: absolute;
      pointer-events: none;
      background: rgba(255, 72, 0, 0.16);
      border: 3px solid #ff4800;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(255, 72, 0, 0.28);
      z-index: 4;
    }

    .pad-measure-key,
    .pad-measure-section {
      position: absolute;
      pointer-events: none;
      z-index: 2;
      padding: 1px 4px;
      color: #5d5d5d;
      font: 700 11px/16px ui-monospace, monospace;
    }

    .pad-measure-section {
      color: #000000;
      background: #ffffff;
      border: 1px solid #000000;
      border-radius: 2px;
    }

    .pad-measure-highlight[data-measure]::after {
      content: attr(data-measure);
      position: absolute;
      top: 4px;
      left: 4px;
      min-width: 18px;
      padding: 1px 5px;
      border-radius: 2px;
      background: #ff4800;
      color: #fff;
      font: 700 11px/16px ui-monospace, monospace;
    }

    .pad-note-ghost {
      position: absolute;
      pointer-events: none;
      z-index: 6;
      width: 18px;
      height: 28px;
      margin-left: -9px;
      margin-top: -20px;
      opacity: 0.55;
    }

    .pad-note-ghost::before {
      content: '';
      position: absolute;
      left: 1px;
      bottom: 2px;
      width: 12px;
      height: 9px;
      border-radius: 50%;
      background: #ff4800;
      transform: rotate(-20deg);
    }

    .pad-note-ghost::after {
      content: '';
      position: absolute;
      left: 12px;
      bottom: 6px;
      width: 2px;
      height: 22px;
      background: #ff4800;
    }

    .pad-note-ghost.is-rest::before {
      width: 10px;
      height: 4px;
      border-radius: 1px;
      left: 4px;
      bottom: 12px;
      transform: none;
    }

    .pad-note-ghost.is-rest::after {
      display: none;
    }

    .pad-measure-ghost {
      position: absolute;
      pointer-events: none;
      z-index: 5;
      background: rgba(255, 72, 0, 0.12);
      border: 2px dashed #ff4800;
      border-radius: 8px;
      opacity: 0.9;
    }

    .at-surface {
      position: relative;
      margin: 0 auto;
    }

    .at-surface svg {
      display: block;
    }

    .at-highlight {
      fill: var(--accent);
    }

    .at-cursor-bar {
      background: rgba(255, 72, 0, 0.08);
      pointer-events: none;
    }

    .at-cursor-beat {
      width: 3px;
      background: var(--accent);
      pointer-events: none;
    }

    .at-selection div {
      background: rgba(255, 72, 0, 0.08);
    }

    .at-highlight * {
      fill: var(--accent) !important;
      stroke: var(--accent) !important;
    }

    body.playback-off .at-cursor-bar,
    body.playback-off .at-cursor-beat,
    body.playback-off .at-highlight,
    body:not(.playback-playing) .at-cursor-bar,
    body:not(.playback-playing) .at-cursor-beat,
    body:not(.playback-playing) .at-highlight {
      display: none !important;
    }
  </style>
  <script src="./vendor/alphaTab.min.js"></script>
</head>
<body class="playback-off">
  <div id="alphaTab-viewport">
    <main id="alphaTab-frame" aria-label="피아노 악보">
      <div id="alphaTab-container"></div>
    </main>
  </div>
  <script>
    (function () {
      'use strict';

      var api = null;
      var lastScore = null;
      var currentScale = null;
      var lastPositionPostedAt = 0;
      var pendingPlay = false;
      var pointer = { x: 0, y: 0 };
      var ignoreNextBeat = false;
      var dragNote = null;
      var highlightedMeasure = -1;
      var ignoreNextMeasureClick = false;
      var measureKeyFifthsList = [];
      var measureSectionLabels = [];
      var pageFit = 1;
      var userZoom = 1;
      var panX = 0;
      var panY = 0;
      var viewportWidthPx = 0;
      var viewportHeightPx = 0;
      var oneFingerPan = true;
      var inputMode = 'off';
      var inputDuration = 'quarter';
      var inputRest = false;
      var noteInputActive = null;
      var measureDrag = null;
      var A4_WIDTH = 794;
      var A4_HEIGHT = 1123;
      var PAGE_GAP = 24;
      var PAGE_GUTTER_X = 12;
      var PAGE_GUTTER_Y = 8;
      var MIN_ZOOM = 1;
      var MAX_ZOOM = 4;
      var viewport = document.getElementById('alphaTab-viewport');
      var frame = document.getElementById('alphaTab-frame');
      var container = document.getElementById('alphaTab-container');
      var activePointers = {};
      var viewGesture = null;
      var pageBreaks = [];
      var paperStackHeight = A4_HEIGHT;
      var playbackPlaying = false;
      var followedPlaybackSystemY = null;
      var KEY_TONICS = {
        '-7': 'C♭', '-6': 'G♭', '-5': 'D♭', '-4': 'A♭', '-3': 'E♭',
        '-2': 'B♭', '-1': 'F', '0': 'C', '1': 'G', '2': 'D', '3': 'A',
        '4': 'E', '5': 'B', '6': 'F♯', '7': 'C♯'
      };

      function viewSize() {
        return {
          w: viewportWidthPx || (viewport && viewport.clientWidth) || window.innerWidth,
          h: viewportHeightPx || (viewport && viewport.clientHeight) || window.innerHeight
        };
      }

      function pageBaseX(scale) {
        var availableW = Math.max(1, viewSize().w - PAGE_GUTTER_X * 2);
        var contentW = A4_WIDTH * scale;
        return PAGE_GUTTER_X + Math.max(0, (availableW - contentW) / 2);
      }

      function resetView() {
        userZoom = 1;
        panX = 0;
        panY = 0;
        followedPlaybackSystemY = null;
        if (frame) frame.classList.remove('playback-follow');
        activePointers = {};
        viewGesture = null;
        applyPageFit();
      }

      function sourceToPageY(sourceY) {
        var offset = 0;
        for (var i = 0; i < pageBreaks.length; i++) {
          if (sourceY < pageBreaks[i].sourceY) break;
          offset = pageBreaks[i].offset;
        }
        return sourceY + offset;
      }

      function pageToSourceY(pageY) {
        for (var i = pageBreaks.length - 1; i >= 0; i--) {
          var start = pageBreaks[i].sourceY + pageBreaks[i].offset;
          if (pageY >= start) return pageY - pageBreaks[i].offset;
        }
        return pageY;
      }

      function scoreChunks(surface) {
        return Array.prototype.filter.call(
          surface.children,
          function (child) { return !!child.querySelector('svg'); }
        );
      }

      function unpaginateScore() {
        var surface = container && container.querySelector('.at-surface');
        if (!surface) {
          pageBreaks = [];
          paperStackHeight = A4_HEIGHT;
          return;
        }
        var chunks = scoreChunks(surface);
        for (var i = 0; i < chunks.length; i++) {
          var chunk = chunks[i];
          var applied = chunk.getAttribute('data-pad-offset');
          if (applied == null) continue;
          var top = Number.parseFloat(chunk.style.top) || 0;
          chunk.style.top = (top - (Number.parseFloat(applied) || 0)) + 'px';
          chunk.removeAttribute('data-pad-offset');
          chunk.removeAttribute('data-pad-source-top');
        }
        pageBreaks = [];
        paperStackHeight = A4_HEIGHT;
      }

      function paginateScore() {
        var surface = container && container.querySelector('.at-surface');
        if (!surface) {
          pageBreaks = [];
          paperStackHeight = A4_HEIGHT;
          return paperStackHeight;
        }
        unpaginateScore();
        var chunks = scoreChunks(surface);
        pageBreaks = [];
        var offset = 0;
        var pageIndex = 0;
        for (var i = 0; i < chunks.length; i++) {
          var chunk = chunks[i];
          chunk.style.marginTop = '0px';
          var sourceTop = Number.parseFloat(chunk.style.top) || 0;
          var height = Number.parseFloat(chunk.style.height) ||
            chunk.offsetHeight || 0;
          var pageStart = pageIndex * (A4_HEIGHT + PAGE_GAP);
          var pageY = sourceTop + offset - pageStart;
          if (pageY > 0 && pageY + height > A4_HEIGHT) {
            pageIndex++;
            var nextPageStart = pageIndex * (A4_HEIGHT + PAGE_GAP);
            offset = nextPageStart - sourceTop;
            pageBreaks.push({ sourceY: sourceTop, offset: offset });
          }
          chunk.setAttribute('data-pad-source-top', String(sourceTop));
          chunk.setAttribute('data-pad-offset', String(offset));
          chunk.style.top = (sourceTop + offset) + 'px';
        }
        paperStackHeight =
          Math.max(A4_HEIGHT, (pageIndex + 1) * A4_HEIGHT + pageIndex * PAGE_GAP);
        surface.style.height = paperStackHeight + 'px';
        return paperStackHeight;
      }

      function scorePaperHeight() {
        return Math.max(A4_HEIGHT, paperStackHeight);
      }

      function setCursorPageOffset(measureIndex) {
        var master = masterBarBounds(measureIndex);
        var box = master && boxSize(
          master.lineAlignedBounds || master.visualBounds || master.realBounds
        );
        var cursors = container && container.querySelector('.at-cursors');
        if (!cursors) return;
        var offset = box ? sourceToPageY(box.y) - box.y : 0;
        cursors.style.transform = 'translateY(' + offset + 'px)';
      }

      function followPlaybackMeasure(measureIndex) {
        if (!playbackPlaying) return;
        var box = systemBox(measureIndex);
        if (!box) return;
        var pageTop = sourceToPageY(box.y);
        if (followedPlaybackSystemY === pageTop) return;

        var view = viewSize();
        var scale = pageFit * userZoom;
        var pageBottom = sourceToPageY(box.y + box.h);
        var screenTop = PAGE_GUTTER_Y + panY + pageTop * scale;
        var screenBottom = PAGE_GUTTER_Y + panY + pageBottom * scale;
        var topGuard = Math.max(32, view.h * 0.12);
        var bottomGuard = Math.max(topGuard + 1, view.h * 0.76);
        followedPlaybackSystemY = pageTop;
        if (screenTop >= topGuard && screenBottom <= bottomGuard) return;

        var targetTop = Math.max(32, view.h * 0.18);
        panY = targetTop - PAGE_GUTTER_Y - pageTop * scale;
        if (frame) frame.classList.add('playback-follow');
        applyPageFit();
      }

      function clampPan() {
        var view = viewSize();
        var rawH = scorePaperHeight();
        var scale = pageFit * userZoom;
        var contentW = A4_WIDTH * scale;
        var contentH = rawH * scale;
        var availableW = Math.max(1, view.w - PAGE_GUTTER_X * 2);
        var availableH = Math.max(1, view.h - PAGE_GUTTER_Y * 2);
        if (!(contentW > availableW)) {
          panX = 0;
        } else {
          panX = Math.max(
            Math.min(0, availableW - contentW),
            Math.min(0, panX)
          );
        }
        if (!(contentH > availableH)) {
          panY = 0;
        } else {
          panY = Math.max(
            Math.min(0, availableH - contentH),
            Math.min(0, panY)
          );
        }
      }

      function applyPageFit() {
        var view = viewSize();
        var availableW = Math.max(1, view.w - PAGE_GUTTER_X * 2);
        pageFit = view.w > 0 ? Math.min(1, availableW / A4_WIDTH) : 1;
        if (!Number.isFinite(pageFit) || pageFit <= 0) pageFit = 1;
        userZoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, userZoom));
        clampPan();
        if (container) {
          container.style.width = A4_WIDTH + 'px';
        }
        if (frame) {
          var baseX = pageBaseX(pageFit * userZoom);
          frame.style.width = A4_WIDTH + 'px';
          frame.style.height = scorePaperHeight() + 'px';
          frame.style.transformOrigin = 'top left';
          frame.style.transform =
            'translate(' + (baseX + panX) + 'px,' +
            (PAGE_GUTTER_Y + panY) + 'px) scale(' +
            (pageFit * userZoom) + ')';
        }
        return pageFit;
      }

      function postToFlutter(type, data) {
        if (!window.FlutterBridge || !window.FlutterBridge.postMessage) return;
        window.FlutterBridge.postMessage(JSON.stringify({
          type: type,
          data: data || {}
        }));
      }

      function errorMessage(error) {
        if (!error) return '악보를 표시할 수 없습니다.';
        return error.message || error.toString();
      }

      function updateScale(width, height) {
        if (Number(width) > 0) viewportWidthPx = Number(width);
        if (Number(height) > 0) viewportHeightPx = Number(height);
        applyPageFit();
        return true;
      }

      function pointerList() {
        return Object.keys(activePointers).map(function (id) {
          return activePointers[id];
        });
      }

      function shouldCapturePointers(count) {
        return count >= 2 || (count === 1 && oneFingerPan);
      }

      function startPinchGesture() {
        var pts = pointerList();
        if (pts.length < 2) return null;
        var dx = pts[0].x - pts[1].x;
        var dy = pts[0].y - pts[1].y;
        return {
          type: 'pinch',
          dist: Math.hypot(dx, dy) || 1,
          zoom: userZoom,
          panX: panX,
          panY: panY,
          midX: (pts[0].x + pts[1].x) / 2,
          midY: (pts[0].y + pts[1].y) / 2
        };
      }

      function applyPinchGesture() {
        if (!viewGesture || viewGesture.type !== 'pinch') return;
        var pts = pointerList();
        if (pts.length < 2) return;
        var dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
        var midX = (pts[0].x + pts[1].x) / 2;
        var midY = (pts[0].y + pts[1].y) / 2;
        var nextZoom = Math.max(
          MIN_ZOOM,
          Math.min(MAX_ZOOM, viewGesture.zoom * (dist / viewGesture.dist))
        );
        var oldScale = pageFit * viewGesture.zoom;
        var newScale = pageFit * nextZoom;
        userZoom = nextZoom;
        if (oldScale > 0) {
          var ratio = newScale / oldScale;
          var oldBaseX = pageBaseX(oldScale);
          var newBaseX = pageBaseX(newScale);
          panX = midX - newBaseX -
            (viewGesture.midX - oldBaseX - viewGesture.panX) * ratio;
          panY = midY - PAGE_GUTTER_Y -
            (viewGesture.midY - PAGE_GUTTER_Y - viewGesture.panY) * ratio;
        }
        applyPageFit();
      }

      function zoomViewBy(factor, centerX, centerY) {
        if (!Number.isFinite(factor) || factor <= 0) return userZoom;
        var view = viewSize();
        var focusX = Number.isFinite(centerX) ? centerX : view.w / 2;
        var focusY = Number.isFinite(centerY) ? centerY : view.h / 2;
        followedPlaybackSystemY = null;
        if (frame) frame.classList.remove('playback-follow');
        var oldZoom = userZoom;
        var nextZoom = Math.max(
          MIN_ZOOM,
          Math.min(MAX_ZOOM, oldZoom * factor)
        );
        if (nextZoom === oldZoom) return userZoom;
        var oldScale = pageFit * oldZoom;
        var newScale = pageFit * nextZoom;
        var ratio = newScale / oldScale;
        var oldBaseX = pageBaseX(oldScale);
        var newBaseX = pageBaseX(newScale);
        panX = focusX - newBaseX - (focusX - oldBaseX - panX) * ratio;
        panY = focusY - PAGE_GUTTER_Y -
          (focusY - PAGE_GUTTER_Y - panY) * ratio;
        userZoom = nextZoom;
        applyPageFit();
        return userZoom;
      }

      function clearNoteGhost() {
        var old = container.querySelectorAll('.pad-note-ghost');
        for (var i = 0; i < old.length; i++) old[i].remove();
        noteInputActive = null;
      }

      function clearMeasureGhost() {
        var old = container.querySelectorAll('.pad-measure-ghost');
        for (var i = 0; i < old.length; i++) old[i].remove();
      }

      function drawNoteGhost(point, rest) {
        var surface = container.querySelector('.at-surface') || container;
        var old = container.querySelectorAll('.pad-note-ghost');
        for (var i = 0; i < old.length; i++) old[i].remove();
        if (!point) return;
        var ghost = document.createElement('div');
        ghost.className = 'pad-note-ghost' + (rest ? ' is-rest' : '');
        ghost.setAttribute('aria-hidden', 'true');
        ghost.style.left = point.x + 'px';
        ghost.style.top = sourceToPageY(point.y) + 'px';
        surface.appendChild(ghost);
      }

      function drawMeasureGhostAt(measureIndex) {
        clearMeasureGhost();
        var box = measureUnion(measureIndex) || systemBox(measureIndex);
        if (!box) return;
        var surface = container.querySelector('.at-surface') || container;
        var ghost = document.createElement('div');
        ghost.className = 'pad-measure-ghost';
        ghost.setAttribute('aria-hidden', 'true');
        ghost.style.left = box.x + 'px';
        ghost.style.top = sourceToPageY(box.y) + 'px';
        ghost.style.width = box.w + 'px';
        ghost.style.height = box.h + 'px';
        surface.appendChild(ghost);
      }

      function viewToSourcePoint(vx, vy) {
        var scale = pageFit * userZoom;
        if (!(scale > 0)) scale = 1;
        var baseX = pageBaseX(scale);
        return {
          x: (vx - baseX - panX) / scale,
          y: pageToSourceY((vy - PAGE_GUTTER_Y - panY) / scale)
        };
      }

      function durationTicks(type) {
        switch (type) {
          case 'whole': return 3840;
          case 'half': return 1920;
          case 'eighth': return 480;
          case '16th': return 240;
          default: return 960;
        }
      }

      function barDurationTicks(bar) {
        try {
          if (bar && bar.masterBar && typeof bar.masterBar.calculateDuration === 'function') {
            var duration = Number(bar.masterBar.calculateDuration());
            if (duration > 0) return duration;
          }
        } catch (_) {}
        return 3840;
      }

      function resolveStaffHit(point) {
        if (!point || !lastScore || !lastScore.masterBars) return null;
        var best = null;
        var count = lastScore.masterBars.length;
        for (var mi = 0; mi < count; mi++) {
          var master = masterBarBounds(mi);
          if (!master || !master.bars || !master.bars.length) continue;
          for (var bi = 0; bi < master.bars.length; bi++) {
            var barBounds = master.bars[bi];
            var box = boxSize(barBounds.visualBounds || barBounds.realBounds);
            if (!box) continue;
            var padY = Math.max(24, box.h * 0.75);
            var inX = point.x >= box.x - 4 && point.x <= box.x + box.w + 4;
            var inY = point.y >= box.y - padY && point.y <= box.y + box.h + padY;
            var cx = Math.max(box.x, Math.min(point.x, box.x + box.w));
            var cy = Math.max(box.y, Math.min(point.y, box.y + box.h));
            var dist = (point.x - cx) * (point.x - cx) + (point.y - cy) * (point.y - cy);
            if (inX && inY) dist *= 0.01;
            if (!best || dist < best.dist) {
              best = {
                dist: dist,
                masterIndex: mi,
                barBounds: barBounds,
                box: box
              };
            }
          }
        }
        if (!best || best.dist > 120 * 120) return null;
        var bar = best.barBounds.bar;
        if (!bar) return null;
        var beat = nearestBeatInBar(best.barBounds, point.x);
        if (!beat) {
          var voices = bar.voices || [];
          for (var vi = 0; vi < voices.length; vi++) {
            if (voices[vi] && voices[vi].beats && voices[vi].beats.length) {
              beat = voices[vi].beats[0];
              break;
            }
          }
        }
        if (!beat) return null;
        var onsetTicks = onsetTicksForPoint(best.box, bar, point.x, beat);
        var midi = midiAtStaffBox(bar, best.box, point.y);
        var ghostPoint = staffPointForMidiBox(best.box, bar, midi);
        ghostPoint.x = Math.max(
          best.box.x + 8,
          Math.min(point.x, best.box.x + best.box.w - 8)
        );
        return {
          beat: beat,
          bar: bar,
          masterIndex: best.masterIndex,
          midi: midi,
          onsetTicks: onsetTicks,
          ghostPoint: ghostPoint,
          box: best.box
        };
      }

      function nearestBeatInBar(barBounds, pointX) {
        var beats = barBounds.beats || [];
        var bestBeat = null;
        var bestDist = Infinity;
        for (var i = 0; i < beats.length; i++) {
          var bounds = beats[i];
          var beat = bounds.beat;
          var vb = boxSize(bounds.visualBounds || bounds.realBounds);
          if (!beat) continue;
          var mid = vb ? vb.x + vb.w / 2 : pointX;
          var dist = Math.abs(pointX - mid);
          if (dist < bestDist) {
            bestDist = dist;
            bestBeat = beat;
          }
        }
        return bestBeat;
      }

      function onsetTicksForPoint(box, bar, pointX, beat) {
        var ratio = box.w > 0 ? (pointX - box.x) / box.w : 0;
        ratio = Math.max(0, Math.min(0.999, ratio));
        var total = barDurationTicks(bar);
        var step = durationTicks(inputDuration);
        var ticks = Math.round((ratio * total) / step) * step;
        ticks = Math.max(0, Math.min(total - step, ticks));
        if (!(ticks >= 0)) {
          return beat && beat.displayStart != null ? beat.displayStart : 0;
        }
        return ticks;
      }

      function updateNoteGhostFromView(x, y) {
        var point = viewToSourcePoint(x, y);
        var rect = (viewport || frame).getBoundingClientRect();
        pointer.x = rect.left + x;
        pointer.y = rect.top + y;
        var hit = resolveStaffHit(point);
        if (!hit) return noteInputActive;
        drawNoteGhost(hit.ghostPoint, inputRest);
        noteInputActive = hit;
        return noteInputActive;
      }

      function commitNoteGhost() {
        if (!noteInputActive) {
          clearNoteGhost();
          return false;
        }
        postStaffTapHit(noteInputActive);
        clearNoteGhost();
        return true;
      }

      function updateMeasureDragFromView(x, y) {
        if (!measureDrag) return;
        var target = measureAtSourcePoint(viewToSourcePoint(x, y));
        if (target == null) return;
        measureDrag.toIndex = target;
        drawMeasureGhostAt(target);
      }

      function commitMeasureDrag() {
        if (!measureDrag) return;
        var fromIndex = measureDrag.fromIndex;
        var toIndex = measureDrag.toIndex;

          y1 = Math.min(y1, boxes[i].y);

          y2 = Math.max(y2, boxes[i].y + boxes[i].h);

        for (var i = 0; i < count; i++) {
          var boxes = measureBoxes(i);

        var measureIndex = bar.masterBar ? bar.masterBar.index : bar.index;
        var payload = {
          partIndex: staff.track.index,
          measureIndex: measureIndex,
          staff: staff.index + 1,
          voiceIndex: voice.index,
          onsetTicks: beat.displayStart,
          midi: midi,
          noteIndex: note.index
        };
        if (originalMidi != null) payload.originalMidi = originalMidi;
        postToFlutter(type, payload);
      }

      function playerOutputMode() {
        try {
          return alphaTab.synth.PlayerOutputMode.WebAudioScriptProcessor;
        } catch (_) {
          return 1;
        }
      }

      function unlockAudio() {
        try {
          var Ctx = window.AudioContext || window.webkitAudioContext;
          if (Ctx) {
            if (!window._padAudioCtx) window._padAudioCtx = new Ctx();
            if (window._padAudioCtx.state === 'suspended') {
              window._padAudioCtx.resume();
            }
          }
          if (api && api.player && api.player.output && api.player.output.activate) {
            api.player.output.activate();
          }
        } catch (_) {}
      }

      window.bridgeLoadScore = function (xmlContent) {
        if (!api) return false;
        try {
          unpaginateScore();
          resetView();
          var bytes = new TextEncoder().encode(xmlContent);
          if (typeof api.load === 'function') {
            lastScore = null;
            api.load(bytes);
            postPlaybackTimeline(0);
            return true;
          }
          var score = alphaTab.importer.ScoreLoader.loadScoreFromBytes(
            bytes,
            api.settings
          );
          var trackIndexes = score.tracks.map(function (_, index) {
            return index;
          });
          lastScore = score;
          api.renderScore(score, trackIndexes);
          return true;
        } catch (error) {
          postToFlutter('error', { message: errorMessage(error) });
          return false;
        }
      };

      window.bridgeLoadScoreWithFilter = function (xmlContent) {
        return window.bridgeLoadScore(xmlContent);
      };

      window.bridgeGoToMeasure = function (measureNumber) {
        var barIndex = measureNumber - 1;
        var bar = container.querySelector('[data-bar-id="' + barIndex + '"]');
        if (bar) bar.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };

      window.bridgeHighlightMeasure = function (measureIndex) {
        return highlightMeasure(measureIndex);
      };

      window.bridgeTapAt = function (x, y) {
        return selectMeasureAtView(x, y);
      };

      window.bridgeSetViewport = function (width, height) {
        return updateScale(width, height);
      };

      window.bridgeSetOneFingerPan = function (enabled) {
        oneFingerPan = !!enabled;
        if (!oneFingerPan && viewGesture && viewGesture.type === 'pan') {
          viewGesture = null;
        }
        return oneFingerPan;
      };

      window.bridgeSetInputMode = function (mode, duration, rest) {
        inputMode = mode || 'off';
        inputDuration = duration || 'quarter';
        inputRest = !!rest;
        if (inputMode !== 'note' && inputMode !== 'rest') {
          clearNoteGhost();
        }
        if (inputMode === 'off') {
          measureDrag = null;
          clearMeasureGhost();
        }
        return inputMode;
      };

      window.bridgeStartMeasureDrag = function (measureIndex) {
        var index = Number(measureIndex);
        if (!Number.isFinite(index) || index < 0) return false;
        measureDrag = { fromIndex: index, toIndex: index };
        drawMeasureGhostAt(index);
        return true;
      };

      window.bridgeCancelMeasureDrag = function () {
        measureDrag = null;
        clearMeasureGhost();
        return true;
      };

      window.bridgeSetView = function (zoom, nextPanX, nextPanY) {
        followedPlaybackSystemY = null;
        if (frame) frame.classList.remove('playback-follow');
        if (Number.isFinite(zoom)) userZoom = zoom;
        if (Number.isFinite(nextPanX)) panX = nextPanX;
        if (Number.isFinite(nextPanY)) panY = nextPanY;
        applyPageFit();
        return true;
      };

      window.bridgeZoomBy = function (factor, centerX, centerY) {
        return zoomViewBy(factor, centerX, centerY);
      };

      window.bridgePointer = function (phase, id, x, y) {
        handleViewPointer(phase, id, x, y);
        return true;
      };

      window.bridgeSetMeasureKeys = function (fifths) {
        measureKeyFifthsList = Array.isArray(fifths) ? fifths : [];
        drawMeasureKeys();
        return measureKeyFifthsList.length;
      };

      window.bridgeSetMeasureSections = function (labels) {
        measureSectionLabels = Array.isArray(labels) ? labels : [];
        drawMeasureSections();
        return measureSectionLabels.length;
      };

      window.bridgeSetCursor = function (measureNumber, beatIndex) {
        postToFlutter('currentBarChanged', { measure: measureNumber });
        postToFlutter('currentBeatChanged', {
          measure: measureNumber,
          beatIndex: beatIndex || 0
        });
      };

      window.bridgeClearCursor = function () {};

      window.bridgeSetZoom = function (scale) {
        if (!api || !Number.isFinite(scale)) return false;
        currentScale = Math.max(0.5, Math.min(2.0, scale));
        api.settings.display.scale = currentScale;
        api.updateSettings();
        if (lastScore) api.render();
        return true;
      };

      window.bridgeSetLoopRange = function (startMeasure, endMeasure) {
        postToFlutter('loopRangeSet', {
          startMeasure: startMeasure,
          endMeasure: endMeasure
        });
      };

      window.bridgeSetPlaybackVisible = function (visible) {
        document.body.classList.toggle('playback-off', !visible);
        if (!visible) {
          document.body.classList.remove('playback-playing');
          pendingPlay = false;
          if (api && api.isReadyForPlayback) {
            try { api.stop(); } catch (_) {}
          }
        } else {
          unlockAudio();
          postPlaybackTimeline(0);
        }
        return true;
      };

      window.bridgeRefreshPlayback = function () {
        postPlaybackTimeline(0);
        return true;
      };

      window.bridgePlayPause = function () {
        if (!api) return false;
        unlockAudio();
        try {
          if (api.player && api.player.output && api.player.output.activate) {
            api.player.output.activate();
          }
        } catch (_) {}
        if (!api.isReadyForPlayback) {
          pendingPlay = true;
          return false;
        }
        try {
          api.playPause();
          return true;
        } catch (error) {
          postToFlutter('playerIssue', { message: errorMessage(error) });
          return false;
        }
      };

      window.bridgePausePlayback = function () {
        if (!api || !api.isReadyForPlayback) return false;
        api.pause();
        return true;
      };

      window.bridgeStopPlayback = function () {
        pendingPlay = false;
        if (!api || !api.isReadyForPlayback) return false;
        api.stop();
        return true;
      };

      window.bridgeSeekPlayback = function (positionMs) {
        if (!api || !api.isReadyForPlayback || !Number.isFinite(positionMs)) {
          return false;
        }
        var duration = playbackDurationMs();
        var next = Math.max(0, duration > 0 ? Math.min(duration, positionMs) : positionMs);
        api.timePosition = next;
        postToFlutter('playerPositionChanged', {
          currentTimeMs: next,
          durationMs: duration,
          currentTick: Number(api.tickPosition) || 0,
          endTick: Number(api.endTick) || 0
        });
        return true;
      };

      window.bridgeSetPlaybackSpeed = function (speed) {
        if (!api || !Number.isFinite(speed)) return false;
        api.playbackSpeed = Math.max(0.5, Math.min(1.5, speed));
        return true;
      };

      window.bridgeSetViewportWidth = updateScale;
      window.bridgeAutoScale = updateScale;

      if (typeof alphaTab === 'undefined') {
        postToFlutter('error', { message: 'alphaTab library not loaded' });
        return;
      }

      fetch(new URL('./vendor/alphaTab.min.js', document.baseURI).href)
        .then(function (response) {
          if (!response.ok) throw new Error('worker source');
          return response.text();
        })
        .then(function (source) {
          installInlineSynthWorker(source);
          initAlphaTab();
        })
        .catch(function () {
          initAlphaTab();
        });
    })();
  </script>
</body>
</html>
