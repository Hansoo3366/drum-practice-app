<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piano score editor</title>
  <link href="../styles/bravura-font-codes.css" rel="stylesheet">
  <link href="../styles/bootstrap.css" rel="stylesheet">
  <link href="../styles/fonts.css" rel="stylesheet">
  <link href="../styles/media.css" rel="stylesheet">
  <link href="../styles/ribbon.css" rel="stylesheet">
  <link href="../styles/dialogs.css" rel="stylesheet">
  <link href="../styles/menus.css" rel="stylesheet">
  <link href="../styles/piano.css" rel="stylesheet">
  <link href="../styles/general.css" rel="stylesheet">
  <link href="../styles/tree.css" rel="stylesheet">
  <style>
    html, body, #smoo {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
  </style>
  <!-- Smoosic's release bundle expects the jQuery global before it boots. -->
  <script src="../jquery.min.js"></script>
  <script src="../jszip.js"></script>
  <script src="../smoosic.js"></script>
  <script>
    (function () {
      function post(payload) {
        if (window.SmoosicBridge && window.SmoosicBridge.postMessage) {
          window.SmoosicBridge.postMessage(JSON.stringify(payload));
        }
      }

      function decodeUtf8(base64) {
        var binary = window.atob(base64);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i += 1) {
          bytes[i] = binary.charCodeAt(i);
        }
        return new TextDecoder('utf-8').decode(bytes);
      }

      function encodeUtf8(value) {
        var bytes = new TextEncoder().encode(value);
        var binary = '';
        for (var i = 0; i < bytes.length; i += 1) {
          binary += String.fromCharCode(bytes[i]);
        }
        return window.btoa(binary);
      }

      window.smoosicHost = {
        loadMusicXml: async function (base64) {
          var xml = decodeUtf8(base64);
          var document = new DOMParser().parseFromString(xml, 'text/xml');
          var score = Smo.XmlToSmo.convert(document);
          await Smo.SuiApplication.instance.view.changeScore(score);
          post({ type: 'loaded' });
        },
        exportMusicXml: function () {
          var document = Smo.SmoToXml.convert(
            Smo.SuiApplication.instance.view.storeScore
          );
          var xml = new XMLSerializer().serializeToString(document);
          post({ type: 'musicXml', value: encodeUtf8(xml) });
        }
      };

      document.addEventListener('DOMContentLoaded', function () {
        // Smoosic application mode eagerly downloads every instrument
        // SoundFont before it creates the editor. The Flutter host owns the
        // piano playback decision, so keep editor startup independent from
        // that optional network resource.
        if (Smo.SuiSampleMedia) {
          Smo.SuiSampleMedia.samplePromise = async function () {};
        }
        var config = { mode: 'application', domContainer: 'smoo' };
        var readySent = false;
        var notifyReady = function () {
          if (readySent) return;
          readySent = true;
          post({ type: 'ready' });
        };
        // configure() waits for the renderer's first full redraw. On a large
        // score that promise can take longer than the UI needs to become
        // interactive, so announce readiness as soon as Smoosic has created
        // its application instance and keep the configure promise for errors.
        var readyPoll = window.setInterval(function () {
          if (Smo.SuiApplication.instance &&
              Smo.SuiApplication.instance.view) {
            window.clearInterval(readyPoll);
            notifyReady();
          }
        }, 50);
        Smo.SuiApplication.configure(config).then(function () {
          window.clearInterval(readyPoll);
          notifyReady();
        }).catch(function (error) {
          window.clearInterval(readyPoll);
          post({ type: 'error', message: String(error) });
        });
      });
    })();
  </script>
</head>
<body>
  <div id="smoo"></div>
</body>
</html>
