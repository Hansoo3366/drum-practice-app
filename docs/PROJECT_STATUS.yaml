decisions:
  - id: "D-001"
    date: "2026-08-19"
    decision: "모든 AI는 AGENTS.md를 공통 규칙으로 사용하고 Cursor, Claude, Gemini, Copilot용 진입 파일은 이 규칙을 참조한다."
  - id: "D-002"
    date: "2026-08-19"
    decision: "현재 상태는 YAML, 작업 순서는 Markdown 체크리스트, 작업 이력은 append-only Markdown으로 관리한다."
  - id: "D-003"
    date: "2026-08-19"
    status: "superseded by D-081"
    decision: "기획서의 기본 기술 방향인 Flutter, pdfrx, flutter_soloud, alphaTab 우선 후보를 유지하되 도입 시점에 호환성을 검증한다."
  - id: "D-004"
    date: "2026-08-19"
    status: "superseded by D-082"
    decision: "앱 이름은 Page-a-Diddle, Bundle/Application ID는 com.hansookim.pageadiddle, 최소 지원은 iOS 15와 Android API 26으로 한다."
  - id: "D-005"
    date: "2026-08-19"
    decision: "기능 중심 구조, Riverpod 상태 관리/DI, go_router 라우팅, Drift/SQLite 로컬 메타데이터 저장을 사용한다."
  - id: "D-006"
    date: "2026-08-19"
    decision: "현재 Dart 3.9.2와 코드 생성기 호환성을 위해 drift 2.29.0, drift_flutter 0.2.7, drift_dev 2.29.0을 사용한다."
  - id: "D-007"
    date: "2026-08-19"
    decision: "기준 기획서를 v3로 변경하고, 팀 워크스페이스와 실시간 합주 동기화를 포함한 합주 시스템을 Future F-12~F-18로 추가한다. 현재 v3 파일은 v2와 바이트 단위로 동일하므로 추가 요구는 사용자 요청을 기준으로 기록했다."
  - id: "D-008"
    date: "2026-08-19"
    status: "superseded by D-081"
    decision: "기준 기획서를 v4로 변경하고 Jam Session v1/v2를 Future가 아닌 MVP 6/7로, Native Digital Score를 MVP 8로 재배치한다."
  - id: "D-009"
    date: "2026-08-19"
    decision: "OS File Picker의 원본을 직접 참조하지 않고 앱 문서 디렉터리로 복사하며 DB에는 상대 경로를 저장한다."
  - id: "D-010"
    date: "2026-08-19"
    decision: "Flutter Android 빌드는 Android Studio 내장 JDK 25 대신 호환되는 시스템 JDK 17을 사용한다."
  - id: "D-012"
    date: "2026-08-19"
    decision: "DESIGN.md는 색/타이포/간격/라운드 토큰 기준으로만 사용한다. 웹 쇼핑몰 레이아웃, 로고, 브랜드 서사는 복사하지 않고 드러머 앱과 어두운 Viewer에 맞게 옮긴다. 한국어 문구는 product-copy 규칙이 우선한다."
  - id: "D-013"
    date: "2026-08-19"
    decision: "DESIGN.md가 검증한 밝은 색상 토큰만 일반 앱 셸에 적용하고 시스템 다크 테마는 추측해 만들지 않는다. 악보 Viewer는 연주 가독성을 위해 기존 어두운 화면을 유지한다."
  - id: "D-014"
    date: "2026-08-19"
    decision: "Tap Tempo는 최근 최대 6개 탭 간격을 평균하고 2초 넘게 쉬면 새 측정을 시작한다. 측정값은 악보 BPM에 자동 저장하지 않는다."
  - id: "D-015"
    date: "2026-08-19"
    decision: "flutter_soloud 최신 4.1.7은 Dart 3.11 이상이 필요하므로 현재 Flutter 3.35.7/Dart 3.9.2와 호환되는 3.5.4를 고정한다. SDK 업그레이드 시 4.x 전환을 재검토한다."
  - id: "D-016"
    date: "2026-08-19"
    decision: "MVP 1 메트로놈은 4/4와 4박 Count-In으로 제한한다. flutter_soloud 3.5.4에는 예약 재생 API가 없어 Dart Timer를 사용하고, SDK와 flutter_soloud 4.x 전환 시 playScheduled 기반 정밀 clock으로 교체한다."
  - id: "D-017"
    date: "2026-08-19"
    decision: "MVP 1 일반 오디오는 앱 로컬 복사와 Viewer 재생·일시정지만 제공한다. 속도, 루프, Sync Anchor는 중복 구현하지 않고 MVP 2 M2-08~M2-10에서 확장한다."
  - id: "D-018"
    date: "2026-08-19"
    decision: "PDF Measure는 원본을 수정하지 않고 songId, page, number와 페이지 기준 0~1 정규화 rect로 저장한다. Section, Tempo, 박자표, Sync는 각 후속 로드맵에서 Measure 메타데이터를 확장한다."
  - id: "D-019"
    date: "2026-08-19"
    decision: "M2-02 Section은 기획서의 INTRO, VERSE, PRE, CHORUS, BRIDGE, OUTRO 표준값과 없음만 제공한다. 사용자 정의 Section은 현재 범위에서 만들지 않고 필요성이 확인될 때 확장한다."
  - id: "D-020"
    date: "2026-08-19"
    decision: "M2-03 Tempo Map은 Measure 시작 번호를 키로 하는 별도 테이블에 저장한다. STEP은 시작 BPM만, GRADUAL은 시작·끝 BPM을 저장하며 BPM은 40~240으로 제한한다."
  - id: "D-021"
    date: "2026-08-19"
    decision: "M2-04 Time Signature Map은 Measure 시작 번호를 키로 하는 별도 테이블에 저장한다. 분자는 1~32, 분모는 1·2·4·8·16·32만 허용하고 Viewer에서는 시작 마디에 `분자/분모`를 표시한다."
  - id: "D-022"
    date: "2026-08-19"
    decision: "M2-05 현재 마디는 동기화 전 단계이므로 DB에 저장하지 않고 Viewer 세션 상태로만 관리한다. 번호 선택 시 해당 Measure 페이지로 이동하며 Highlight 오버레이는 PDF 제스처를 차단하지 않는다."
  - id: "D-023"
    date: "2026-08-19"
    decision: "M2-06은 음악 Timeline과 Sync Anchor가 없는 상태에서 자동 진행을 추측 구현하지 않는다. Follow/Page 선택, 오디오 재생 중 수동 이동의 AUTO PAUSED, Resume Live 복귀만 Viewer 세션 상태로 제공하고 실제 자동 currentMeasure·페이지 이동은 M2-08에서 연결한다."
  - id: "D-024"
    date: "2026-08-19"
    decision: "M2-07은 M1-18의 로컬 오디오 저장·DB 연결·Viewer 재생을 재사용한다. 오디오가 없는 Smart Score Viewer에서 기존 곡 정보 시트를 여는 진입점만 추가하고, 별도 오디오 연결 UI나 새 저장 모델은 만들지 않는다."
  - id: "D-025"
    date: "2026-08-19"
    status: "superseded by D-026"
    decision: "PDF Viewer 기본 보기는 악보 한 장 전체가 화면에 들어오는 맞춤으로 한다. 2장 보기는 인접 페이지를 한 행에 배치하고, 스크롤 보기는 세로 연속 레이아웃과 가로 맞춤을 사용한다. 기존 Half Page Turn은 맞춤 모드에서만 노출한다."
  - id: "D-026"
    date: "2026-08-19"
    status: "active"
    decision: "반쪽 넘김은 2장 보기와 역할이 겹치고 Viewer 아이콘을 늘리므로 제거한다. PDF 보기 진입점은 항상 같은 보기 아이콘으로 맞춤·2장·스크롤 시트를 연다."
  - id: "D-027"
    date: "2026-08-19"
    status: "active"
    decision: "2장 보기의 초기 맞춤은 개별 페이지가 아니라 한 행의 두 페이지 전체 영역을 기준으로 계산한다. pdfrx 영역 맞춤은 PdfPageAnchor.all을 사용해 전체 영역이 화면에 들어오게 한다."
  - id: "D-028"
    date: "2026-08-19"
    status: "active"
    decision: "악보 Viewer의 파일명 헤더는 한 줄 메타데이터와 52px 툴바로 축소하고 3초 비활성 후 숨긴다. 헤더 제목을 누르면 숨기고, 숨겨진 화면 상단을 누르면 다시 표시한다. 마디 편집 중에는 헤더를 숨기지 않는다."
  - id: "D-029"
    date: "2026-08-20"
    status: "active"
    decision: "Viewer 메뉴바는 Scaffold appBar가 아닌 PDF 위 Stack 오버레이로 렌더링한다. 표시 토글 때 PDF 레이아웃 재계산과 재맞춤을 실행하지 않아 터치 반응을 즉시 유지한다."
  - id: "D-030"
    date: "2026-08-20"
    status: "active"
    decision: "메뉴바가 숨겨진 Viewer는 상단 72px만 메뉴바 호출 영역으로 예약한다. 그 아래 본문 탭은 다음 페이지로 넘기고, 한 손가락 가로 스와이프는 왼쪽 이전·오른쪽 다음 페이지로 처리한다. 세로 스크롤은 스크롤 보기에서 유지한다."
  - id: "D-031"
    date: "2026-08-20"
    status: "superseded by D-033"
    decision: "Viewer 상단 바는 상태바 영역까지 어두운 배경을 채우고 제목만 남긴다. 하단 제어바에는 페이지 슬라이더와 이전·다음·마디 쓰기·설정을 두며, 음악·메트로놈·레이아웃·자동 진행·주석·제스처·상태표시줄·Measure 편집 도구는 설정 팝업으로 묶는다. 레이아웃 자동은 사용자가 선택했을 때 가로 2장, 세로 스크롤로 계산한다."
  - id: "D-032"
    date: "2026-08-20"
    status: "superseded by D-034"
    decision: "메트로놈은 Viewer를 벗어나지 않는다. 설정 팝업에서 BPM 40~240, Count-In, 시작·정지를 조절하고 시작하면 팝업을 닫은 뒤 악보 위 상태 칩으로 BPM과 현재 박자를 표시한다. 기존 독립 메트로놈의 flutter_soloud waveform과 MetronomeSequence를 재사용한다."
  - id: "D-033"
    date: "2026-08-20"
    status: "active"
    decision: "Viewer의 중앙 본문 탭은 표시 중인 메뉴바를 숨기고, 좌우 가장자리 탭과 한 손가락 가로 스와이프는 이전·다음 페이지를 유지한다. 혼란을 주는 마디 추가/마디 쓰기와 페이지 제스처 설정 UI는 제거하고, 하단 버튼과 설정 팝업은 자유선 주석 쓰기·표시·지우기로 사용한다. 주석은 현재 Viewer 세션 상태로 관리한다."
  - id: "D-034"
    date: "2026-08-20"
    status: "active"
    decision: "Viewer 메트로놈은 1/4·2/4·3/4·4/4·5/4·6/4·3/8·5/8·6/8·7/8·9/8·12/8 박자와 직접 그린 음표 아이콘(4분·8분·16분 4연/6연·셋잇단) 단위를 제공하고, 마디의 각 박 악센트를 선택할 수 있다. 선택한 단위에 맞춰 클릭 간격을 나누며 기본 패턴은 1박 강박과 나머지 기본 박이다."
  - id: "D-035"
    date: "2026-08-20"
    status: "active"
    decision: "독립 메트로놈과 Viewer 메트로놈은 동일한 MetronomeSequence, 박자·음표 단위·Count-In·악센트 레벨 규칙을 사용한다. BPM은 40~240 범위에서 숫자 직접 입력과 ±1 버튼으로 조절하고, 각 박은 강박·기본·뮤트 3단계 막대를 탭해 순환한다."
  - id: "D-036"
    date: "2026-08-20"
    status: "active"
    decision: "M2-08은 마디 번호와 오디오 초를 AudioAnchors에 저장하고 재생 위치를 100ms마다 읽어 Anchor 사이를 선형 보간한다. M2-09는 Anchor 두 개를 기준으로 SoLoud 핸들을 시작 위치로 seek해 A-B 반복하며, Tempo Map 기반 정밀 계산은 후속 개선으로 남긴다."
  - id: "D-037"
    date: "2026-08-20"
    status: "active"
    decision: "M2-10 재생 속도는 DB에 저장하지 않는 Viewer 세션 설정으로 두고 0.5x~1.5x 범위에서 SoLoud setRelativePlaySpeed에 즉시 반영한다."
  - id: "D-038"
    date: "2026-08-20"
    status: "active"
    decision: "Cue는 곡·마디당 하나의 짧은 텍스트를 DB에 저장하고 같은 마디 저장 시 덮어쓴다. Viewer 설정에서 등록·수정·삭제하며 악보 마디 하단에 표시하고 Cue Sound는 후속 범위로 둔다."
  - id: "D-039"
    date: "2026-08-20"
    status: "active"
    decision: "M3-01 Tempo Trainer는 곡별 데이터를 저장하지 않는 최소 세션 도구로 시작한다. 사용자가 반복 완료를 누르면 설정한 반복 횟수마다 증가량만큼 BPM을 올리고, 시작·목표·증가·반복 값과 4/4 메트로놈을 같은 화면에서 조절한다. 곡·Measure 연결은 목표 BPM과 연습 기록 단계에서 확장한다."
  - id: "D-040"
    date: "2026-08-20"
    status: "active"
    decision: "M3-02는 Measure마다 Difficult 하나만 저장하는 최소 태그로 구현한다. 태그 변경은 곡 updatedAt을 갱신해 Library 어려운 필터가 즉시 재조회되게 하고, 다른 연습 태그는 연습 기록 흐름에서 확장한다."
  - id: "D-041"
    date: "2026-08-20"
    status: "active"
    decision: "M3-03 연습 기록은 곡별 시작 시각·종료 시각·재생 시간·BPM만 저장하고 Viewer 설정에서 명시적으로 기록을 종료할 때 생성한다. 앱 종료·중단 시 자동 복구와 목표 BPM은 각각 후속 통계·M3-04 범위로 둔다."
  - id: "D-042"
    date: "2026-08-20"
    status: "active"
    decision: "M3-04 목표 BPM은 곡 단위 Songs.targetBpm으로 저장하고 40~240 범위를 사용한다. Viewer에서 목표를 수정한 뒤 같은 시작·목표 BPM으로 Tempo Trainer를 열며, Measure/Section별 목표는 M3-05 이후로 둔다."
  - id: "D-043"
    date: "2026-08-20"
    status: "active"
    decision: "M3-05는 M2-09의 AudioAnchor 재생 루프를 재사용하고 반복 설정에 Section 선택을 추가한다. Section은 시작·끝 Anchor가 각각 있어야 하며, Anchor 없는 PDF에서의 시간 기반 자동 반복은 후속 범위로 둔다."
  - id: "D-044"
    date: "2026-08-20"
    status: "active"
    decision: "M3-06 통계는 별도 집계 테이블 없이 곡별 PracticeSessions 스트림에서 계산한다. 현재는 횟수·총 시간·평균 BPM·최고 BPM·목표 달성 여부만 제공하고, 날짜별 차트와 구간별 통계는 후속 범위로 둔다."
  - id: "D-045"
    date: "2026-08-20"
    status: "superseded by D-046"
    decision: "기획서의 초기 외부 저장소 흐름에 맞춰 M4-01은 OS 파일 선택기에서 Google Drive를 고를 수 있게 하고, 앱으로 복사한 파일의 Songs.sourceProvider를 기록한다. 서비스별 OAuth와 앱 내부 파일 목록은 클라이언트 설정이 준비될 때 후속 연결한다."
  - id: "D-046"
    date: "2026-08-20"
    status: "active"
    decision: "OS 파일 선택기는 선택한 파일의 실제 Local·Google Drive·Dropbox 등 서비스 식별자를 안정적으로 제공하지 않는다. 별도 원본 선택 화면을 제거하고 확인 가능한 os_file_provider만 기록하며, 서비스별 이름과 원격 ID는 해당 OAuth/API 연결 후 저장한다."
  - id: "D-047"
    date: "2026-08-20"
    status: "active"
    decision: "Google Drive·Dropbox·OneDrive 앱 내부 연결은 외부 앱 등록 설정이 준비될 때까지 보류하고 M4-04 WebDAV를 진행한다. WebDAV는 HTTPS만 허용하고 PROPFIND Depth 0으로 연결을 확인하며 자격 증명은 Drift가 아닌 Android Keystore/iOS Keychain 기반 flutter_secure_storage에 저장한다."
  - id: "D-048"
    date: "2026-08-20"
    status: "active"
    decision: "M4-05는 새 저장소 추상화 없이 기존 WebDavConnection에 Depth 1 목록을 추가한다. DAV XML 접두사와 무관하게 로컬 이름으로 파싱하고, 요청 서버와 다른 origin은 제외하며 폴더와 PDF만 표시한다."
  - id: "D-049"
    date: "2026-08-20"
    status: "active"
    decision: "M4-06은 별도 동기화 테이블 없이 Songs의 remoteUri·remoteModifiedAt·remoteSize·syncStatus를 사용한다. 폴더 조회 시 다운로드 당시 스냅샷과 현재 WebDAV 메타데이터를 비교하고 같은 폴더에서 사라진 연결 곡은 Missing으로 갱신한다."
  - id: "D-050"
    date: "2026-08-20"
    status: "active"
    decision: "M4-07은 WebDAV PDF를 먼저 Cloud Only 곡으로 Library에 등록하고 세트리스트에서 일괄 저장한다. 다운로드는 동일 HTTPS origin, PDF 경로, 최대 100MB로 제한하고 리디렉션을 따르지 않는다. 외부 설정 대기 항목은 setup_required에 유지한 채 MVP 5로 진행한다."
  - id: "D-051"
    date: "2026-08-20"
    status: "active"
    decision: "M5-01 Stage Mode는 별도 Viewer를 복제하지 않고 기존 ScoreViewer에 stage=true 상태를 전달한다. 여러 Stage 곡 교체는 참조 수 기반 StageModeController로 wakelock과 immersive UI를 공유하고 마지막 Viewer가 종료될 때만 복구한다."
  - id: "D-052"
    date: "2026-08-20"
    status: "active"
    decision: "M5-03 Performance Lock은 Stage에서 메뉴·Measure/주석 편집·BPM·Sync·Cue 편집 UI를 차단한다. 허용은 좌우 가장자리/스와이프 페이지 이동과 두 손가락 Zoom이며, 가운데 터치는 무시한다. Bluetooth Pedal은 M5-04에서 연결한다."
  - id: "D-053"
    date: "2026-08-20"
    status: "active"
    decision: "M5-04 페달과 키보드는 같은 PerformanceAction을 쓴다. 짧은 입력은 페이지, 500ms 이상은 재생/일시정지, 350ms 안 두 번은 반복이다. HID 키는 앱 문서 JSON에 저장하고 일반 Viewer 설정에서 바꾸며, Stage Performance Lock에서도 페달은 동작한다."

  - id: "D-054"
    date: "2026-08-20"
    status: "active"
    decision: "M5-05 Stage 곡 이동은 메뉴 없이 첫·마지막 페이지의 이전·다음 입력으로 처리한다. 세트리스트 진행은 오프라인 곡만 세고 미저장 곡은 건너뛴다. HUD는 IgnorePointer로 두고 실수 터치를 막는다."

  - id: "D-055"
    date: "2026-08-20"
    status: "active"
    decision: "M6-01은 JamSessionStore 계약과 MemoryJamSessionStore로 세션 생성·4자리 코드 참가를 구현한다. 기기 간 공유는 Firebase/Supabase 설정 후 같은 계약을 구현해 교체한다. QR 초대는 M6-02로 둔다."
  - id: "D-056"
    date: "2026-08-20"
    status: "active"
    decision: "Jam Session은 클라우드 서버 없이 같은 Wi-Fi만 사용한다. 호스트 기기가 UDP로 코드를 알리고 TCP로 세션 상태를 공유한다."
  - id: "D-057"
    date: "2026-08-20"
    status: "active"
    decision: "M6-02 초대 QR은 `pageadiddle:jam:` 접두사와 4자리 코드를 담는다. 숫자 코드만 찍혀도 참가할 수 있다."
  - id: "D-058"
    date: "2026-08-20"
    status: "active"
    decision: "M6-03 Presence는 TCP 연결과 멤버 ping으로 유지한다. 소켓이 닫히면 즉시 목록에서 빼고, ping이 끊기면 먼저 끊김으로 표시한 뒤 목록에서 뺀다. Conductor/Member 권한은 M6-04로 둔다."
  - id: "D-059"
    date: "2026-08-20"
    status: "active"
    decision: "M6-04는 JamPermissions로 Conductor만 초대·세션 리드를 하고 Member는 Follow/Return to Live를 쓴다. 곡·BPM·Start/Stop 실제 제어는 M6-05 이후에서 Conductor canLead로 막는다."
  - id: "D-060"
    date: "2026-08-20"
    status: "active"
    decision: "M6-05 Setlist 공유는 PDF 전송 없이 JamSharedSetlist 스냅샷(항목 ID·곡명·BPM·순서)만 세션 상태에 실어 보낸다. Conductor만 shareSetlist할 수 있고, 실제 곡 열기는 M6-06에서 처리한다."
  - id: "D-061"
    date: "2026-08-20"
    status: "superseded by D-090"
    decision: "이전 결정: M6-06은 세션 currentSongId를 갱신하고 제목·아티스트로만 로컬 Song을 매칭했다. SetlistEntry.id 기반 기기별 매핑은 D-090으로 대체한다."
  - id: "D-062"
    date: "2026-08-20"
    status: "active"
    decision: "M6-07 위치 공유는 JamScorePosition(page, measure)을 Conductor Viewer에서 디바운스 전송한다. Member는 자신의 entryId 매핑 악보에서 measure 메타데이터를 우선 적용하고, 공통 파트 Timeline 자동 매핑은 F-01에서 확장한다."
  - id: "D-063"
    date: "2026-08-20"
    status: "active"
    decision: "M6-08~M6-09는 JamMusicState와 playing을 Conductor만 갱신한다. selectSong·shareSetlist 시 playing을 false로 돌린다. 정밀 클록 동기화는 MVP 7이다."
  - id: "D-064"
    date: "2026-08-20"
    status: "active"
    decision: "M6-10 Follow는 Viewer 로컬 상태다. 기본 ON, 수동 이동 시 OFF, Return to Live는 세션의 위치·음악·재생을 다시 적용하고 ON으로 돌린다."
  - id: "D-065"
    date: "2026-08-20"
    status: "active"
    decision: "M7-01 Count-In Sync는 세션 countInBars(0/1/2/4)만 공유한다. MetronomeSequence가 여러 마디 Count-In을 지원하고, 시각 동기 startAt은 M7-02에서 다룬다."
  - id: "D-066"
    date: "2026-08-20"
    status: "active"
    decision: "M7-02는 updatePlaying(true) 시 jamStartLead(750ms) 뒤의 UTC startAt을 기록한다. 각 Viewer는 startAt까지 대기 후 로컬 클릭을 시작한다. 네트워크 tick 전송은 하지 않는다."
  - id: "D-067"
    date: "2026-08-20"
    status: "active"
    decision: "M7-03 Metronome Sync는 startAt+BPM으로 절대 step 인덱스를 계산한다. Timer.periodic 대신 다음 step 시각에 재예약하고, 지연으로 놓친 step은 건너뛴다."
  - id: "D-068"
    date: "2026-08-20"
    status: "superseded"
    decision: "이전 결정: M7-04에서 Host Click을 기본값으로 두었다. 2026-08-26 사용자 요구에 따라 D-089로 Individual Click 기본 정책으로 변경했다."
  - id: "D-069"
    date: "2026-08-20"
    status: "superseded by D-102"
    decision: "이전 결정: M7-05에서 Conductor가 host/individual 클릭을 선택했다. 현재는 D-102에 따라 선택 UI를 제공하지 않고 모든 기기가 공통 설정의 로컬 클릭을 재생한다."
  - id: "D-070"
    date: "2026-08-20"
    status: "active"
    decision: "M7-06 Loop 공유는 JamLoopState(enabled, start/end measure, section)를 Conductor만 갱신한다. Member Follow 시 Viewer 로컬 Loop에 적용하고, selectSong·shareSetlist 시 clearLoop한다."
  - id: "D-071"
    date: "2026-08-21"
    status: "active"
    decision: "M7-07 Clock 보정은 TCP clock-ping/pong으로 NTP 스타일 RTT offset을 추정하고, 중앙값 기반 3~9 샘플로 안정화한다. drift 50ms 이상 감지 시 즉시 수정하지 않고 다음 마디 첫 박(step % stepsPerBar == 0)에서 startAt을 보정해 클릭 튀김을 막는다. Conductor는 별도 보정 없이 자신의 로컬 시계를 기준으로 삼는다."
  - id: "D-072"
    date: "2026-08-21"
    status: "superseded by D-081"
    decision: "M8-01 MusicXML Import는 기존 xml 패키지로 score-partwise를 파싱한다. 드럼 파트 판정은 MIDI Channel 10(0-indexed 9)과 이름 키워드(drum/perc/kit)만 사용하고 midiProgram은 사용하지 않는다. SongFileStorage.storeMusicXml은 MusicXML 헤더를 검증하고 Songs.scoreType='native_score'로 저장한다. 별도 DB 마이그레이션 없이 텍스트 컬럼에 새 값을 추가한다."
  - id: "D-073"
    date: "2026-08-21"
    status: "superseded by D-081"
    decision: "M8-02 alphaTab 연동은 webview_flutter 4.10+를 사용하고, alphaTab JS는 CDN에서 로드한다. Bridge는 core/score_engine/alphatab_bridge.dart의 sealed class로 Flutter→alphaTab 5개 명령과 alphaTab→Flutter 4+2개 이벤트를 정의한다. NativeScoreViewer는 WebView 격리 위젯으로 loadFlutterAsset으로 HTML을 로드하고 JavaScriptChannel로 이벤트를 받는다. ScoreViewerScreen은 scoreType='native_score'일 때 NativeScoreViewer로 분기한다."
  - id: "D-074"
    date: "2026-08-21"
    status: "superseded by D-081"
    decision: "M8-03 드럼 렌더링은 alphaTab scoreLoaded 콜백에서 파트 이름(drum/perc/kit)과 isPercussion으로 드럼 트랙만 필터링한다. bridgeLoadScoreWithFilter로 drumOnly 플래그를 전달하고, bridgeAutoScale로 컨테이너 너비 기반 스케일(너비/800, 최대 1.0)을 계산한다. NativeScoreViewer는 LayoutBuilder로 반응형 스케일을 적용하고 ScoreLoadedEvent로 하단 메타데이터 바를 표시한다."
  - id: "D-075"
    date: "2026-08-21"
    status: "superseded by D-081"
    decision: "M8-04 Bar/Beat Cursor는 alphaTab HTML의 cursorBarEl 오버레이로 마디 하이라이트를 표시한다. bridgeSetCursor는 measureNumber→barIndex 변환 후 overlay 위치를 계산하고 currentBarChanged/currentBeatChanged를 Flutter에 발송한다. _NativeScoreViewerWidget은 Jam Session playing 감지 시 100ms 주기 타이머로 startAt+BPM 기반 절대 step을 계산해 measure/beat를 추출하고 updateCursor를 호출한다."
  - id: "D-076"
    date: "2026-08-21"
    status: "superseded by D-081"
    decision: "M8-05 Playback Sequence는 pass 기반 반복 계산을 사용한다. Simple repeat는 repeatCountMap으로 반복별 독립 카운터를 관리하고, D.C./D.S.는 1회만 실행(dcUsed/dsUsed 플래그). Fine과 To-Coda는 pass > 1(2회차 이상)에서만 활성화된다. Ending은 pass 번호와 endingNumber가 일치할 때만 연주한다. _parseDirection은 <direction>/<sound> 요소에서 segno/coda/D.C./D.S./Fine/To-Coda를 파싱한다."
  - id: "D-077"
    date: "2026-08-21"
    status: "superseded by D-081"
    decision: "M8-06 외부 음악 Sync는 SoLoud loadFile/play/setPause로 오디오 재생하고 getPosition 타이머로 진행바를 갱신한다. 로컬 메트로놈은 startAt + jamMetronomeStepIndex 절대 step으로 커서를 동기화한다. ScoreLoadedEvent의 tempo를 BPM 기본값으로 사용한다. _NativeScoreToolbar이 오디오 진행바/BPM/마디·박을 하단에 통합 표시한다."
  - id: "D-078"
    date: "2026-08-26"
    status: "active"
    decision: "Drift 마이그레이션은 설치 버전 메타데이터가 실제 스키마보다 뒤처진 기존 DB를 복구할 수 있도록 addColumn 전에 PRAGMA table_info로 컬럼 존재 여부를 확인한다. Library·Setlist가 같은 AppDatabase 스트림을 사용하므로 공통 DB 복구를 우선 처리한다."
  - id: "D-079"
    date: "2026-08-26"
    status: "superseded by D-081"
    decision: "전체 검수에서 문서 완료 기록과 코드의 M8 구현물 부재가 충돌하는 것을 확인했다. 당시에는 코드에 없는 기능을 완료로 표시하지 않고 M8-01~06을 보류, 진행률을 71/97로 정정했다."
  - id: "D-080"
    date: "2026-08-26"
    status: "active"
    decision: "곡 등록 서비스의 BPM도 UI·Smart Score·기획과 동일하게 40~240만 허용한다. 경계 밖 값은 저장 전에 거부하고 회귀 테스트로 고정한다."
  - id: "D-081"
    date: "2026-08-26"
    status: "superseded by D-112"
    decision: "사용자 결정으로 Native Digital Score(MVP 8: MusicXML·alphaTab·NativeScoreViewer·Playback Sequence·외부 음악 Sync)는 제품 개발 범위에서 제거한다. 관련 항목은 활성 로드맵 집계에서 제외하고, 기존 설계·코드·작업 로그는 변경 이력으로만 남긴다."
  - id: "D-082"
    date: "2026-08-26"
    status: "active"
    decision: "iOS는 배포 대상에서 제외한다. Android를 유일한 배포·실기기 검증 대상으로 삼고 iOS simulator/build 검증은 차단 항목으로 보지 않는다."
  - id: "D-083"
    date: "2026-08-26"
    status: "active"
    decision: "LAN Jam은 같은 Wi-Fi의 실제 Android 기기 두 대에서 생성·참가·곡·페이지·BPM·Start/Stop·Loop·공통 로컬 클릭·Clock 보정을 순서대로 검증한다. B-012를 다음 검증 최우선으로 둔다."
  - id: "D-084"
    date: "2026-08-26"
    status: "active"
    decision: "Google Drive 웹 클라이언트 ID를 CloudOAuthConfig Android 기본값으로 포함하고 `GOOGLE_SERVER_CLIENT_ID` build define override를 허용한다. Android OAuth 클라이언트는 패키지명과 release 서명 SHA-1 등록으로 검증한다."
  - id: "D-085"
    date: "2026-08-26"
    status: "superseded by D-124"
    decision: "이전 결정: Dropbox App Key를 기본값으로 두고 빈 override에서만 시스템 파일 선택기로 fallback했다. 현재는 D-124처럼 빈 define이 OAuth를 끄지 않는다. Android redirect는 `db-<APP_KEY>://oauth`다."
  - id: "D-086"
    date: "2026-08-26"
    status: "active"
    decision: "클라우드 악보는 연습 도구가 아니므로 ToolsScreen에 별도 타일을 두지 않는다. WebDAV·Google Drive·Dropbox 악보 가져오기는 Library의 추가 흐름에서 시작하고, WebDAV 연결 관리도 그 흐름의 연결 화면에서 처리한다."
  - id: "D-087"
    date: "2026-08-26"
    status: "superseded by D-102"
    decision: "이전 결정: Jam Session 시작 시 기본 Individual Click을 사용했다. 현재의 시작·동기화 동작은 D-102의 공통 메트로놈 정책을 따른다."
  - id: "D-088"
    date: "2026-08-26"
    status: "active"
    decision: "JamMusicState에 meterNumerator/meterDenominator, subdivision, accents를 추가한다. 호스트가 설정을 변경하거나 시작할 때 LAN으로 공유하고 Member Viewer는 초기 snapshot과 이후 변경 모두 기본으로 적용한다."
  - id: "D-089"
    date: "2026-08-26"
    status: "superseded by D-102"
    decision: "이전 결정: 합주에서 Individual Click을 기본값으로 하고 Host Click을 선택했다. 현재는 선택 UI를 제거하고 모든 기기가 공통 startAt과 호스트 설정으로 같은 박자를 로컬 재생한다."
  - id: "D-090"
    date: "2026-08-26"
    status: "active"
    decision: "Jam Setlist 공유의 안정 식별자는 Setlist.id와 SetlistEntry.id다. 네트워크에는 순서·entryId·제목·아티스트·BPM만 보내고 로컬 Song.id/PDF는 보내지 않는다. 각 기기는 setlistId/entryId별 자신의 파트 악보 Song.id를 SharedPreferences에 저장하며, 최초에는 후보 선택·재선택을 제공한다. 페이지 번호가 아닌 공통 Measure/Beat/Section Timeline 매핑은 Future F-01에서 확장한다."
  - id: "D-091"
    date: "2026-08-26"
    status: "active"
    decision: "Jam 참가자의 음악 파트는 Conductor/Member 권한과 분리한다. 생성·참가 시 보컬·기타·베이스·드럼·키보드·기타 직접 입력 중 하나를 선택하고, instrument/customInstrument를 LAN payload와 참가자 카드에 함께 전달한다. 기존 payload에 파트가 없으면 드럼으로 복원한다."
  - id: "D-092"
    date: "2026-08-26"
    status: "active"
    decision: "Jam은 게임 대기실처럼 멤버가 준비를 명시해야 호스트가 시작할 수 있다. 새 멤버는 ready=false로 입장하고, 연결된 멤버가 모두 ready일 때만 Conductor의 Start를 허용한다. 호스트의 playing/startAt 상태가 멤버 화면 진입과 로컬 메트로놈 시작의 단일 신호다."
  - id: "D-093"
    date: "2026-08-26"
    status: "active"
    decision: "Jam 공유처럼 화면 전환 직후 필요한 세트리스트 데이터는 Drift live stream이 아닌 일회성 snapshot 조회를 사용한다. 편집 화면의 실시간 목록은 기존 watchItems()를 유지한다."
  - id: "D-094"
    date: "2026-08-26"
    status: "active"
    decision: "Jam 참가자의 악보는 PDF를 네트워크로 복사하지 않고 각 기기 Library의 Song.id를 Setlist.id+SetlistEntry.id에 로컬 연결한다. 공유 곡 목록에서 곡별 연결·재선택을 제공하고, 연결이 없으면 Start 전에 해당 곡을 고르게 한다."
  - id: "D-095"
    date: "2026-08-27"
    status: "active"
    decision: "홈 헤더 브랜드 아이콘은 모바일 폭에서만 표시한다. 760dp 이상에서는 NavigationRail의 브랜드 아이콘만 사용해 폴드 펼침·태블릿에서 중복을 제거한다."
  - id: "D-096"
    date: "2026-08-27"
    status: "active"
    decision: "화면 전환이나 Jam 세트리스트 선택처럼 즉시 필요한 목록은 Riverpod stream의 cached first value 대신 SetlistRepository의 현재 일회성 DB snapshot을 사용한다."
  - id: "D-097"
    date: "2026-08-27"
    status: "active"
    decision: "세트리스트는 현재 기기 로컬 DB 데이터로 유지한다. 앱 삭제·새 기기 자동 복원은 제공하지 않으며, 사용자가 기기 간 이동을 요구할 때 명시적 export/import 또는 동기화를 별도 범위로 결정한다."
  - id: "D-098"
    date: "2026-08-27"
    status: "active"
    decision: "Jam Member가 공유 Setlist를 받으면 현재 기기의 Setlists에 자동 upsert한다. 네트워크에는 PDF를 보내지 않고, 로컬에 없는 곡은 jam_pending 항목으로 제목·아티스트·BPM·순서를 먼저 보존한다."
  - id: "D-099"
    date: "2026-08-27"
    status: "active"
    decision: "Jam 곡별 연결은 Library·기기·Google Drive·Dropbox·WebDAV 중 하나를 선택한다. 외부에서 가져온 PDF/원격 악보는 기존 Library 저장 경로에 등록한 뒤 SetlistEntry를 실제 Song.id로 교체한다."
  - id: "D-100"
    date: "2026-08-27"
    status: "active"
    decision: "Jam에서 선택한 WebDAV 악보는 원격 메타데이터만 연결하지 않고 즉시 오프라인 PDF를 확보한다. 일반 Library WebDAV 탐색은 기존처럼 등록과 다운로드를 분리한다."
  - id: "D-101"
    date: "2026-08-27"
    status: "active"
    decision: "Jam Member는 SetlistEntry별 자신의 오프라인 악보를 우선 사용하고, 없을 때만 방장에게 해당 PDF를 요청해 세션 임시 캐시에 저장한다. 방장 PDF는 Library에 영구 등록하지 않고 Viewer를 읽기 전용으로 연다."
  - id: "D-102"
    date: "2026-08-27"
    status: "active"
    decision: "Individual Click/Host Click 선택은 제품 UI에서 제거한다. Jam의 메트로놈은 Conductor가 BPM·박자표·음표 단위·카운트인·박별 악센트를 설정하고, 모든 기기가 공통 startAt과 동일 설정으로 각자 로컬 클릭을 재생한다. Jam 허브에는 활성 방 복귀와 같은 Wi-Fi 주변 방 탐색을 제공하며, 일반 세트리스트 Viewer는 마지막 페이지에서 다음 곡으로 이어진다."
  - id: "D-103"
    date: "2026-08-27"
    status: "active"
    decision: "세트리스트 곡마다 BPM·박자표·음표 단위·박별 악센트를 SetlistEntry의 nullable metronome_json 프로필로 저장한다. 기존 tempoOverride/BPM과 구형 Jam payload는 유지하고, section·count-in은 세션 상태로 남긴다. Jam 곡 전환 시 해당 프로필을 적용하고 호스트 설정 변경 시 현재 entry 프로필을 갱신한다."
  - id: "D-104"
    date: "2026-08-27"
    status: "active"
    decision: "맞춤·2쪽 보기에서는 현재 페이지/스프레드 영역 밖의 연속 이동을 막고 스크롤 보기만 세로 연속 이동을 허용한다. Jam 참가자의 보기 모드는 기기별로 유지하며, 호스트는 보기 방식이 아닌 논리 페이지·마디·메트로놈 상태만 공유해 서로 다른 화면 비율과 선호를 허용한다."
  - id: "D-105"
    date: "2026-08-27"
    status: "active"
    decision: "Jam 화면의 현재 곡과 역할별 핵심 동작은 화면 하단 하나의 플로팅 컨트롤로 고정한다. Conductor는 이전·다음·시작/정지를, Member는 곡이 아직 없어도 준비 토글을 같은 위치에서 사용하며, 목록은 플로팅 바 높이만큼 하단 여백을 둔다."
  - id: "D-106"
    date: "2026-08-27"
    status: "active"
    decision: "동적 `/score/:songId` 라우트는 GoRouter의 경로 패턴 기반 pageKey를 그대로 쓰지 않고 실제 URI를 페이지 키로 사용한다. 세트리스트 곡 교체 시 이전 PDF Viewer State·컨트롤러·오디오가 재사용되지 않아야 한다."
  - id: "D-107"
    date: "2026-08-27"
    status: "active"
    decision: "Jam Member의 곡 자동 진입은 세션 `playing` 시작과 현재 `currentEntryId`가 로컬에서 열어 둔 entry와 다른지를 함께 확인한다. 같은 곡 재시작은 재진입하지 않고, 방장이 다음 곡으로 바꾸면 참가자 Viewer를 연다."
  - id: "D-108"
    date: "2026-08-27"
    status: "active"
    decision: "Jam은 원격 논리 페이지를 각 참가자의 로컬 보기 모드로 정규화한다. 2쪽 보기에서는 1–2, 3–4 스프레드를 한 위치로 처리하고, 호스트가 1쪽/게스트가 2쪽이어도 동일 스프레드 재이동이나 페이지 지연이 없어야 한다."
  - id: "D-109"
    date: "2026-08-27"
    status: "active"
    decision: "Jam Member는 startAt까지 기다린 뒤 오디오를 준비하지 않는다. 클릭 자산을 먼저 준비하고 로컬 clock offset을 반영한 startAt에서 재생하며, 실행 중 offset 변경은 다음 마디 경계부터 적용한다."
  - id: "D-110"
    date: "2026-08-31"
    status: "active"
    decision: "현재 Dart 3.9.2와 per-beat 악센트·연음·Count-In·Jam 절대 timeline 요구를 만족하는 기존 flutter_soloud 3.5.4와 MetronomeSequence를 유지한다. pub.dev metronome은 현재 기능을 대체하지 못하므로 추가하지 않으며, flutter_soloud 4.x의 예약 재생은 Dart 3.11 이상 SDK 업그레이드 때 재검토한다."
  - id: "D-111"
    date: "2026-08-31"
    status: "active"
    decision: "주석은 현재 pdfrx PdfPageOverlaysBuilder 기반 정규화 stroke 저장 구조를 유지한다. pdf_annotations는 renderer 교체 비용과 낮은 채택도 때문에 추가하지 않고, 입력 경계만 방어한다."
  - id: "D-112"
    date: "2026-09-19"
    status: "active"
    decision: "사용자 결정으로 로컬 피아노 전자악보 MVP 8을 다시 활성화한다. 서버가 필요한 PDF OMR·고급 AI 편곡·레퍼런스 영상 분석은 로컬 기능 이후 Future로 두고, MusicXML 기반 작성·수정·재생·반복 구성·이조·기본 반주를 앱 내부에서 우선 개발한다."
  - id: "D-113"
    date: "2026-09-19"
    status: "active"
    decision: "전자악보의 외부 교환 기준은 MusicXML 4.0과 압축 MXL로 삼고 MIDI는 재생·교환 보조, PDF는 읽기·공유 결과물, 앱 프로젝트 형식은 편집 상태·Section 반복·반주 프로필을 보존하는 내부 형식으로 분리한다."
  - id: "D-114"
    date: "2026-09-19"
    status: "active"
    decision: "PDF 펜 주석 내보내기는 원본 PDF와 편집 가능한 정규화 stroke JSON을 유지하면서 새 PDF에 주석을 평면화하는 비파괴 방식으로 구현한다. 표준 PDF Ink Annotation 또는 프로젝트 패키지 교환은 호환성 요구가 생길 때 확장한다."
  - id: "D-115"
    date: "2026-09-19"
    status: "active"
    decision: "재구성한 전자악보는 Android 앱 내부에서 PDF로 내보낼 수 있어야 한다. PDF에는 작성·수정, 현재 조·이조, 반주·편곡 프로필과 Playback Sequence의 Section 순서·반복 횟수를 반영하고 반복 마디를 실제 펼친 선형 Grand Staff로 조판한다. 이는 기존 PDF 주석 평면화와 별도 기능이며 iOS 지원은 포함하지 않는다."
  - id: "D-116"
    date: "2026-09-19"
    status: "active"
    decision: "M8-02의 상호운용 기준은 MusicXML 4.0 score-partwise로 확정한다. 앱 내부 Score Document는 피아노 다중 staff·voice의 정규화된 onset/duration과 pitch·rest·key·time·clef·tempo·rehearsal·harmony를 보존한다. .musicxml·.xml·표준 .mxl을 지원하고 score-timewise와 unpitched 타악기 표기는 현재 피아노 범위 밖으로 명시적으로 거부한다. DB scoreType은 musicxml을 사용하며 기존 PDF 흐름과 분기한다."
  - id: "D-117"
    date: "2026-09-19"
    status: "superseded by D-145"
    decision: "M8-03 렌더러는 MPL-2.0 alphaTab 1.8.4와 OFL-1.1 Bravura 폰트를 앱에 고정해 완전 오프라인으로 제공한다. core.useWorkers=false와 로컬 SVG 엔진을 사용하고, 재생 사운드폰트는 M8-05 전까지 포함하지 않는다. 피아노 MusicXML의 모든 part·staff를 표시하며 480dp 미만 0.72, 840dp 미만 0.86, 그 이상 1.0 스케일과 barsPerRow=-1 자동 재배치를 적용한다."
  - id: "D-118"
    date: "2026-09-19"
    status: "active"
    decision: "M8-04 편집은 불변 Score Document 전체 스냅샷을 최대 100단계 보관해 undo/redo한다. alphaTab note bounds는 렌더링된 음표 직접 선택에 사용하고 쉼표·코드 심벌은 마디 이벤트 패널에서도 선택한다. 조표·박자표와 마디 구조는 같은 마디 번호의 모든 파트에 적용한다. 저장은 외부 가져오기 원본이 아닌 앱 내부 복사본을 대상으로 원래 MusicXML/MXL 형식을 유지하고, 코덱 왕복 검증과 동일 디렉터리 임시 파일·백업 교체로 실패 시 기존 파일을 복원한다."
  - id: "D-119"
    date: "2026-09-19"
    status: "superseded"
    superseded_by: "D-127"
    decision: "M8-05 로컬 피아노 재생은 별도 Dart 타이머나 flutter_soloud 샘플 스케줄러로 음을 만들지 않는다. 초기 구현은 alphaTab 공식 SONiVOX SoundFont를 썼다. 음색은 D-127의 YDP 그랜드 피아노 샘플로 교체했다."
  - id: "D-120"
    date: "2026-09-19"
    status: "active"
    decision: "M8-06 Playback Sequence는 원본 MusicXML 마디를 복제하지 않고 `playback_sequences/<songId>.json`에 Section 순서와 1~16회 반복만 저장한다. 구간은 마디 rehearsal 표식에서 찾고, 편집 화면은 원본을 보여 주며 편집이 아닐 때만 펼친 선형 악보를 alphaTab 재생·Cursor에 올린다. MusicXML 내보내기는 원본을 유지하고 펼친 악보는 M8-09 PDF에서 다룬다."
  - id: "D-121"
    date: "2026-09-19"
    status: "active"
    decision: "M8-07 이조는 별도 미리듣기 레이어를 두지 않고 Score Document 전체를 undo 가능한 명령으로 바꾼다. 반음과 목표 조는 같은 간격이며, 조표는 원·5도 이동 후 -7~7로 맞춘다. 음이름 표기는 각 마디의 도착 조표를 따르고, 같은 반음이라도 C♯/D♭처럼 사용자가 고른 조표를 유지한다. 옥타브만 옮길 때는 조표를 바꾸지 않는다."
  - id: "D-122"
    date: "2026-09-19"
    status: "active"
    decision: "M8-08 반주는 원본 MusicXML 음표를 덮어쓰지 않고 `arrangement_profiles/<songId>.json`에 끔/블록/박/분산만 저장한다. 생성 음표는 voice `arr`로 보기·재생 점수에만 붙이며, 편집 화면은 원본을 보여 준다. 스트링·오르간·브라스 AI 편곡은 Future로 남긴다."
  - id: "D-123"
    date: "2026-09-19"
    status: "active"
    decision: "M8-09 성능 파일(`.musicxml`·`.xml`·MXL·MIDI·PDF)은 이조가 반영된 현재 편집본에 연주 순서와 반주를 펼친 점수를 쓴다. `.xml`은 구형 확장자이며 내용은 `.musicxml`과 같은 MusicXML 4.0이다. 프로젝트 zip은 편집 가능한 원본 MusicXML과 Sequence·반주 JSON만 담는다. PDF는 alphaTab 스크린샷이 아니라 `pdf` 패키지로 Grand Staff를 벡터 조판한다. 모두 새 파일이며 앱 내부 원본은 덮어쓰지 않는다."
  - id: "D-124"
    date: "2026-09-19"
    status: "active"
    decision: "Google Drive 웹 클라이언트 ID와 Dropbox App Key는 제품 기본값이다. `--dart-define`은 비어 있지 않을 때만 덮어쓴다. `dart_defines.json`을 Cursor/VS Code 실행과 CI 테스트에 넣어 빌드마다 같은 키를 넣는다. 일반 `flutter build apk`는 소스 기본값만으로도 OAuth를 켠다."
  - id: "D-125"
    date: "2026-09-19"
    status: "active"
    decision: "pdfium_flutter Android CMake는 타깃이 Android라 WIN32가 꺼진다. Windows 호스트에서는 CMAKE_HOST_WIN32로 junction 또는 디렉터리 복사를 쓰고, 이 패치를 `android/build.gradle.kts`가 pub-cache CMakeLists에 다시 넣는다."
  - id: "D-126"
    date: "2026-09-19"
    status: "superseded by D-138"
    decision: "연주 순서는 선택한 마디의 역할(인트로·벌스·코러스 등)과 그 역할의 반복 횟수를 다룬다. 다음 빈 마디 추가는 허용한다. 마디 번호 지정·삭제·이동·조표·박자는 넣지 않는다. 조옮김은 앱바 단독 버튼이다. 반주 프로필 도메인과 sidecar는 유지하되 화면 메뉴에서는 뺀다."
  - id: "D-130"
    date: "2026-09-20"
    status: "active"
    decision: "화면 용어는 이조 대신 조옮김을 쓴다."
  - id: "D-129"
    date: "2026-09-20"
    status: "superseded by D-144"
    decision: "전자악보의 조판과 흰 종이는 A4(794×1123px) 단위로 구성한 뒤 화면 너비에 동일 비율로 줄인다. 종이 밖은 회색이다. 핀치로 확대하고 끌어 이동한다. 한 줄 마디 수는 고정하지 않는다. 구간은 렌더된 한 줄에 붙인다. 연주 순서에서 오선 탭은 Flutter가 받아 줄 전체에 주황 박스를 그린다."
  - id: "D-131"
    date: "2026-09-20"
    status: "active"
    decision: "전자악보 화면은 너비에 맞춘 뒤 핀치 줌(1~4배)과 이동을 제공한다. 편집 중 한 손가락은 음표 입력에 두고, 두 손가락으로 확대·이동한다."
  - id: "D-132"
    date: "2026-09-20"
    status: "active"
    decision: "구간 이름은 붙인 줄의 앞만 네모로 표시한다. 이후 마디에 같은 글을 반복하지 않고, 높은음자리표 위에 빨간 한글로 올리지 않는다."
  - id: "D-133"
    date: "2026-09-20"
    status: "superseded by D-144"
    decision: "alphaTab의 각 렌더 시스템이 1123px A4 하단을 넘으면 다음 종이 시작으로 옮긴다. 종이 사이는 24px 회색으로 분리하고, 794px SVG에 별도 좌우 CSS 패딩을 더하지 않는다."
  - id: "D-134"
    date: "2026-09-20"
    status: "active"
    decision: "`Claire de lune`와 `Fantaisie-Impromptu in C♯ Minor`를 기본 MXL로 포함한다. 첫 Library 진입 때 한 번 등록하고 같은 제목의 기존 악보는 중복하지 않으며 사용자가 삭제한 뒤에는 다시 넣지 않는다."
  - id: "D-135"
    date: "2026-09-20"
    status: "active"
    decision: "2/2 값만으로 알라 브레베를 추정하지 않고 MusicXML의 `time symbol=\"cut\"`을 보존해 ¢로 표시한다. `common`은 C, symbol이 없으면 숫자 박자표로 유지한다."
  - id: "D-136"
    date: "2026-09-20"
    status: "active"
    decision: "전자악보 자동 스크롤은 재생 중에만 현재 시스템을 화면 높이 12~76% 안전 영역에 유지한다. 같은 시스템에서는 반복 이동하지 않고 새 시스템이 영역을 벗어날 때만 220ms로 이동한다."
  - id: "D-137"
    date: "2026-09-20"
    status: "active"
    decision: "사용자 내보내기 메뉴는 PDF·MusicXML·프로젝트·MIDI만 제공한다. `.mxl`은 압축 MusicXML, `.xml`은 구형 확장자이므로 가져오기 호환성은 유지하되 새 파일 형식 선택에서는 제외한다."
  - id: "D-138"
    date: "2026-09-20"
    status: "superseded by D-139"
    decision: "연주 순서의 추가는 빈 마디 삽입이 아니라 선택한 구간을 같은 반복 설정의 새 순서 행으로 복제한다. 같은 구간의 중복 행을 유지하고 각 행을 개별 반복·이동·삭제한다. 빈 마디 삽입은 쓰기 도구에만 둔다. 반주 프로필 데이터는 호환성을 위해 유지하되 화면 메뉴는 노출하지 않는다."
  - id: "D-139"
    date: "2026-09-20"
    status: "superseded by D-140"
    decision: "연주 구성은 INTRO/VERSE 구간 표식을 쓰지 않고 마디를 물리적으로 복제·이동·삭제한다. 연주용 악보는 performance_scores/<songId>.musicxml에 저장해 원본 sourcePath를 덮어쓰지 않는다. 음표 입력은 음표 그림 팔레트와 포인터 고스트 미리보기 후 up 시 삽입이며, 마디 탭 시 +/−/복제/드래그 도구를 보여 준다."
  - id: "D-140"
    date: "2026-09-20"
    status: "superseded by D-141"
    decision: "전자악보 표시·입력·재생 타임라인은 WebView/alphaTab을 쓰지 않고 Flutter CustomPainter 네이티브 조판으로 교체한다. MusicScore·MusicXML 코덱은 유지한다. 버전은 사용자가 이름을 정해 추가·삭제하며, 연주용(performance) 자동 항목은 넣지 않는다. 재생은 우선 네이티브 타임라인(커서)이며 alphaTab SoundFont 합성은 후속으로 다시 연결한다."
  - id: "D-141"
    date: "2026-09-20"
    status: "superseded by D-145"
    decision: "전자악보 조판은 flutter_notemus ScoreView(SMuFL/Bravura)를 쓴다. 내부 MusicScore·MusicXML 코덱은 유지하고 렌더/재생 전에 MusicXML로 넘긴다. 재생은 Notemus MidiMapper + MethodChannel 네이티브 시퀀서다. 입력 hit-test는 당분간 native_score_layout을 유지한다. CustomPainter stub·alphaTab WebView는 쓰지 않는다."
  - id: "D-142"
    date: "2026-09-21"
    status: "superseded by D-144"
    decision: "A4 문서는 794×1123 고정 좌표로 조판하고 화면 너비에는 문서 전체를 균일 scale로 맞춘다. Notemus 시스템을 줄마다 가로만 늘리지 않아 음표 비율을 보존하며, 마디·음표·입력 오버레이는 실제 시스템의 페이지·세로 위치·마디선을 투영한 공통 좌표를 사용한다."
  - id: "D-143"
    date: "2026-09-21"
    status: "superseded by D-144"
    decision: "A4는 화면에서 고정 픽셀 크기가 아니라 794:1123 비율의 종이로 해석한다. 좁은 화면의 화면상 오선 간격은 최소 6dp를 목표로 조판하고, Notemus의 onset 정렬로 A4 폭을 넘는 시스템은 해당 시스템만 x/y 균일 축소한다. x축만 늘리거나 전체 문서를 무조건 축소해 모든 줄을 맞추지 않는다."
  - id: "D-144"
    date: "2026-09-21"
    status: "superseded by D-153"
    decision: "전자악보 연습 화면과 출력 레이아웃을 분리한다. 화면은 A4 비율·레터박스·페이지 나눔을 적용하지 않고 Verovio의 viewport-width 시스템 재배치와 연속 세로 문서를 사용한다. 오선 크기는 화면 논리 픽셀 기준으로 유지하며 시스템이 화면보다 넓을 때는 가로 이동을 허용한다. A4 794×1123, 여백, 페이지 나눔은 PDF 출력에만 적용한다."
  - id: "D-145"
    date: "2026-09-21"
    status: "active"
    decision: "Native Digital Score의 표준 조판 엔진은 verovio_flutter 0.3.3 FFI로 포함한 Verovio 6.2.1이다. 내부 MusicScore를 MusicXML로 넘기고 Verovio SVG·HitMap을 Flutter 화면에 표시한다. 화면은 연속 세로 문서이며 A4 비율·레터박스·페이지 나눔은 PDF 출력에만 적용한다. 악보 조판은 CustomPainter로 직접 재구현하지 않고, 재생은 별도 Notemus MIDI adapter 경계를 유지한다."
  - id: "D-146"
    date: "2026-09-21"
    status: "active"
    decision: "버전 생성은 대화상자 취소 시 저장 경로에 들어가지 않는다. 버전 파일과 매니페스트는 원자 저장·실패 시 orphan 파일 정리를 사용하고, 손상 매니페스트는 원본 버전으로 안전하게 fallback한다. Flutter SVG 화면에서는 위치 변환이 불안정한 Verovio direction/tempo text를 숨기고 마디 번호만 표시하며 원본 MusicXML/PDF 데이터는 보존한다."
  - id: "D-147"
    date: "2026-09-21"
    status: "superseded by D-154"
    decision: "버전 추가 버튼은 즉시 파일을 생성하지 않고 새 버전 저장 의도만 설정한다. 사용자가 수정 후 저장할 때 버전 이름을 입력하고 현재 수정본으로 새 버전을 생성한다. 이름 입력 취소는 현재 편집 상태만 유지하며 새 파일·매니페스트는 만들지 않는다. 일반 저장은 기존 활성 버전을 덮어쓴다."
  - id: "D-148"
    date: "2026-09-21"
    status: "active"
    decision: "PDF를 편집 가능한 악보로 바꾸는 기능은 단말 PDF OCR로 처리하지 않는다. 원본 PDF를 보존하고 OMR worker가 후보 MusicXML을 생성한 뒤, 사용자가 인식 결과를 검수·수정하고 확정한 문서만 Native Digital Score로 편입한다. Audiveris 같은 OMR 엔진은 서버 후보로 검토하되 라이선스·드럼 인식률을 별도 검토한다."
  - id: "D-149"
    date: "2026-09-21"
    status: "active"
    decision: "단선 멜로디의 양손 변환은 단순 음표 복사가 아니라 arranger transform으로 분리한다. 원 멜로디는 상단 보표에 보존하고, 하단 보표에는 음역·코드·리듬 기반 반주 초안을 생성한다. 낮은음자리표를 기본 추천하되 분할점과 생성 음표는 사용자가 검수·수정한다."
  - id: "D-150"
    date: "2026-09-21"
    status: "active"
    decision: "스트링·오르간·패드·브라스 반주는 악기 역할·보이싱·리듬 패턴을 가진 다중 파트 MusicXML로 생성하고, Verovio 표기와 MIDI 프로그램·사운드뱅크 재생을 분리한다. 첫 단계는 규칙형 프리셋과 사용자의 수정이며, AI 편곡은 그 다음 단계의 검수 가능한 초안으로 둔다."
  - id: "D-151"
    date: "2026-09-21"
    status: "active"
    decision: "단선 멜로디 변환의 기본 화면·출력은 멜로디 1단, 피아노 오른손 1단, 피아노 왼손 1단의 3단 악보로 한다. 피아노 단독 연주용 2단 Grand Staff는 별도 보기로 유지하고, 최하단 보표는 낮은음자리표를 기본 추천한다."
  - id: "D-127"
    date: "2026-09-19"
    status: "active"
    decision: "로컬 피아노 재생 음색은 SONiVOX EAS(휴대전화용 저해상도 GM) 대신 FreePats YDP Grand Piano(`ydp-grand-piano.sf2`, CC BY 3.0)를 앱 자산으로 둔다. 엔진은 계속 alphaTab 1.8.4 MIDI 합성기다. 원본 샘플은 Zenph Studios Disklavier Pro / OLPC이며, 고해상도 Salamander(약 300MB)는 WebView 메모리와 APK 크기 때문에 쓰지 않는다."
  - id: "D-128"
    date: "2026-09-20"
    status: "active"
    decision: "각 마디의 조는 악보 위 조 이름 오버레이로 보여 준다. alphaTab은 줄 앞에만 조표를 그리므로 MusicXML words를 넣지 않고, 렌더 좌표에 C·G·B♭ 같은 으뜸음을 올린다."
  - id: "D-152"
    date: "2026-09-21"
    status: "active"
    decision: "현재 배포 제품은 Page-a-Diddle 드럼 앱으로 유지하고, 피아노 전자악보는 즉시 별도 저장소로 복제하지 않는다. 추후 Flutter flavor 또는 별도 앱 셸로 분리하며 MusicXML·Verovio·버전 관리·로컬 저장·오디오 계층을 공유한다. 피아노 앱 출시 시 별도 이름·아이콘·Application ID·내비게이션을 정하고, 현재 뷰어·편집·재생에는 전용 서버·AI를 요구하지 않는다. PDF→MusicXML OMR worker는 Future로, AI 편곡은 선택적 품질 계층으로 둔다."
  - id: "D-153"
    date: "2026-09-22"
    status: "active"
    decision: "Verovio FFI 화면 조판은 1/100mm 기준 native A4 page 2100×2970과 adjustPageHeight=false를 사용한다. Flutter 화면은 각 A4 SVG·HitMap page를 화면 폭에 균일 축소하고 페이지 사이 간격·레터박스 없이 연속으로 붙이며, PDF는 PdfPageFormat.a4를 별도로 사용한다. 큰 악보는 페이지별로 준비되는 즉시 공개해 전체 렌더 완료를 기다리지 않는다. Written score는 Playback ON과 Verse/Chorus 설정 중에도 화면에 유지한다. Playback Sequence와 반주 프로필은 Section 범위별 derived MIDI/timeline에만 적용하고, 화면 Verovio 문서의 마디를 복제하지 않는다."
  - id: "D-154"
    date: "2026-09-22"
    status: "active"
    decision: "버전 추가 버튼은 제공하지 않는다. AppBar의 수정 진입 시 버전 이름을 먼저 입력하고, 이름을 확정한 뒤 편집하며, 저장 시 현재 수정본을 새 버전으로 생성·활성화한다. 이름 입력 취소는 편집과 파일 생성을 시작하지 않는다. 확대·축소 입력은 viewport→scene을 한 번만 변환하고, 같은 시스템의 보표 geometry·마디 경계 onset anchor를 공유하며, 두 손가락 제스처 중 음표를 커밋하지 않는다."
  - id: "D-155"
    date: "2026-09-22"
    status: "active"
    decision: "Native 악보 뷰어·입력 제스처는 MuseScore·Dorico·forScore를 벤치마킹 기준으로 삼는다. 일반 마우스 휠·트랙패드 스크롤은 문서 이동, Ctrl/Cmd+휠과 핀치는 확대, 명시적 입력 모드의 hover shadow note는 클릭/탭으로 확정한다. 스크롤은 악보를 변경하거나 고스트 크기를 바꾸지 않으며, 이 기준과 다른 동작은 참고 앱·이득·충돌 제스처를 먼저 기록한다."
  - id: "D-156"
    date: "2026-09-22"
    status: "active"
    decision: "제품 범위를 Android flavor/app shell 기준으로 분리한다. 드럼 `com.hansookim.pageadiddle`은 PDF Viewer·메트로놈 등 드럼 도구를 유지하고, 피아노 `com.hansookim.pianoscore`는 PDF Viewer·MusicXML·악보 편집·MusicXML/PDF 내보내기를 담당한다. 피아노 셸에서는 Tap Tempo·Tempo Trainer·Setlist·Jam을 노출하지 않는다. 저장소는 복제하지 않으며 PDF→MusicXML OMR·AI 편곡은 서버/worker가 필요한 Future다."
  - id: "D-157"
    date: "2026-09-23"
    status: "superseded by D-162"
    decision: "피아노 악보 편집은 Lomse C++ runtime, 악보 표시·PDF 조판은 Verovio FFI로 분리한다. 기존 Flutter UI를 유지하고 Lomse는 opaque-handle FFI bridge 뒤에 둔다. MusicXML snapshot은 저장·버전·복구의 기준이며 Lomse 내부 모델은 런타임 편집 상태다. Lomse import→edit→export→Verovio render 왕복과 Android 성능 PoC가 통과하기 전에는 기존 Smoosic WebView를 fallback으로만 유지한다."
  - id: "D-158"
    date: "2026-09-23"
    status: "active"
    decision: "Verovio xml:id와 Lomse ImoId를 영구 키로 사용하지 않는다. AppElementId와 EventLocator를 앱이 관리하고 partId·measureUid·staff·voice·onsetTicks·chordIndex로 각 엔진 객체를 재탐색한다. Verse·Chorus·Arrangement는 MusicXML이나 엔진 내부가 아닌 project manifest/sidecar에 measureUid와 playCount로 저장한다."
  - id: "D-159"
    date: "2026-09-23"
    status: "active"
    decision: "Lomse native boundary는 native/lomse_bridge/include/page_lomse_bridge.h의 C ABI로 고정한다. Flutter에는 UTF-8 MusicXML·JSON command·revision·export buffer만 노출하고 Lomse 내부 포인터와 STL/편집 fragment는 bridge 안에 격리한다. 이 헤더는 piano flavor 전용이며 native build가 통과하기 전에는 production binary에 링크하지 않는다."
  - id: "D-160"
    date: "2026-09-23"
    status: "superseded by D-162"
    decision: "Dart의 `FfiLomseEditorSession`은 native bridge를 lazy-open하고 library가 없는 빌드에서는 null을 반환한다. 따라서 Lomse dependency와 Gradle packaging이 재현 가능해질 때까지 piano UI는 기존 Smoosic fallback을 사용하며, 드럼 flavor에는 Lomse FFI library를 로드하지 않는다."
  - id: "D-161"
    date: "2026-09-25"
    status: "active"
    decision: "가능성 재검토 결과, Verovio viewer 경로는 패키지·analyze·관련 테스트·두 flavor debug APK build로 현재 구현 가능하다고 판단한다. Lomse editor 경로는 고정 Lomse/FreeType commit 기반 Android arm64 bridge build와 piano-only APK packaging까지 가능함을 확인했지만 실제 Android FFI/instrumentation·target mapping·MusicXML export→Verovio reload 왕복·Android latency가 남아 조건부 target으로 유지한다."
  - id: "D-162"
    date: "2026-09-25"
    status: "superseded by D-163"
    decision: "사용자 결정에 따라 Smoosic을 피아노 제품의 편집기와 fallback에서 제거한다. 피아노 `PianoEditorScreen`은 Lomse C++ FFI session과 Verovio viewer를 연결한 커스텀 화면을 사용하고, AppElementId/EventLocator mapping·명령 범위·왕복 구조·Android latency는 후속 production gate로 검증한다. 드럼 flavor에는 Lomse 변경을 적용하지 않는다."
  - id: "D-163"
    date: "2026-09-25"
    status: "active"
    decision: "피아노 음표 입력은 MuseScore Studio handbook, Flat Replace, PiaScore 읽기/편집 분리를 따른다. 라이브러리 곡은 Verovio 연습 화면으로 열고, 편집 모드와 Edit score 탭은 Dart MusicScore에 기록한다. 기본 탭은 해당 박을 교체하고 마디를 쉼표로 채운다. 화음은 토글이나 Shift+음이름일 때만 더한다. 반음 위는 샵, 아래는 플랫으로 표기한다. 터치에는 Shift가 없어 MuseScore의 클릭=화음 기본값을 쓰지 않는다. Lomse는 제품 입력 경로에 두지 않는다. 화면 건반, 붙임줄 버튼, 잇단음표, 실기기 smoke는 남아 있다. D-164로 입력 UI는 숨긴다."
  - id: "D-164"
    date: "2026-09-25"
    status: "active"
    decision: "사용자 결정으로 음표 입력 UI를 보류하고 PDF→전자악보 변환을 먼저 한다. `noteInputEnabled`가 false면 Edit score 탭, Library 악보 만들기, 연습 화면 연필 버튼을 숨긴다. 입력 코드는 삭제하지 않는다. 이후 순서는 PDF→MXL(Google VM Audiveris), Verse/Chorus 구성과 재구성 PDF, 조옮김, 3단 악보, 스트링·오르간·패드·브라스 반주, 멜로디 자동 반주다. D-112의 ‘OMR은 로컬 입력 이후’ 순서를 이 결정이 바꾼다."
  - id: "D-165"
    date: "2026-09-26"
    status: "active"
    decision: "Audiveris 코드 이름 인식은 기본값이 꺼져 있으므로 PDF→MusicXML 변환에서 일반/코드·가사 유형을 사용자가 고른다. 두 결과 모두 원본과 분리된 후보로 두고 `.omr`·로그 및 정답 MusicXML 비교로 실제 개선을 검증한다. AI 검수는 MusicXML 페이지 구분과 PDF 페이지 수가 맞을 때만 해당 원본 페이지를 사용하며, 위치를 모르면 추정 crop으로 수정 제안을 내지 않는다."
  - id: "D-166"
    date: "2026-09-26"
    status: "active"
    decision: "사용자는 구조 점수 설명이 아니라 실제 서버 OMR 정확도 향상을 요구했다. 앱 점수는 이번 범위에서 바꾸지 않고, 공식 Audiveris 입력 지침의 300/400 DPI 후보 생성과 보수적 구조 선택을 구현한다. 원본 음표를 임의 보정하거나 구조 지표를 정답률로 표시하지 않는다. 추후 실제 MXL·로그·정답 비교로 효과를 검증하며, 두 후보 실행의 시간/메모리 비용을 명시한다."

  - id: "D-167"
    date: "2026-09-26"
    status: "active"
    decision: "사용자가 원본 PDF와 AI 대조 후 승인 보정을 진행하도록 요청했다. 기존 xAI client를 유지하고 원본 마디 영역은 사용자가 명시적으로 지정·전송 확인한다. 전체 XML 재작성 대신 snapshot·ID·현재 값 검증 후 승인한 음높이·단순 음가만 raw XML에 반영한다. 다성부/화음/연음/붙임줄 음가 및 기타 변경은 적용하지 않는다. 이름 있는 별도 버전으로 저장하고 undo는 파일 삭제 없이 이전 버전을 활성화한다. 이미지·XML 전송과 API 요금을 안내하며 실제 정확도는 정답 비교로 별도 검증한다."

