  - id: "AUDIT-BUNDLED-SCORES-001"
    result: "`Claire de lune`와 `Fantaisie-Impromptu in C♯ Minor` MXL을 앱 자산으로 포함하고 첫 Library 진입 때 로컬 악보로 등록한다. 같은 제목이 이미 있으면 중복하지 않으며 삭제한 기본 악보를 다음 실행에서 강제로 되살리지 않는다."
  - id: "AUDIT-TIME-SYMBOL-001"
    result: "MusicXML의 time symbol common/cut을 내부 박자표와 MusicXML 왕복에서 보존한다. Fantaisie-Impromptu의 2/2는 알라 브레베(¢)로 렌더하고 숫자 2/2와 구분한다."
  - id: "AUDIT-DIGITAL-SCORE-AUTO-SCROLL-001"
    result: "alphaTab playedBeat 이벤트의 현재 마디 시스템이 화면 상·하단 안전 영역을 벗어나면 A4 페이지 좌표를 반영한 panY를 갱신해 자동 이동한다. 확대 배율을 유지하고 직접 확대·이동 입력에는 자동 전환 애니메이션을 해제한다."
  - id: "AUDIT-DIGITAL-SCORE-EXPORT-MENU-001"
    result: "전자악보 내보내기 형식을 PDF·MusicXML(.musicxml)·프로젝트(zip)·MIDI(.mid) 네 개로 제한했다. MXL·구형 XML은 기존 파일 가져오기와 내부 원본 보존에만 유지한다."
  - id: "F-07a"
    result: "PDF 300/400 DPI 후보 생성·시간 예산·Java worker 직렬 실행을 server/omr/omr_server.py에 구현했다. 실제 Audiveris 인식률 검증은 제외한다."
  - id: "F-07b"
    result: "MusicXML 타임라인 기반 구조 검사·누락 방어 후보 선택·recognition.json·diagnostics API를 구현하고 단위/모의 파이프라인 테스트를 통과했다."
  - id: "F-07c"
    result: "루트 업로드용 update.sh에 pipeline 버전 health 확인과 /etc/default/omr를 읽는 systemd drop-in을 추가했다. 실제 VM 실행은 아직 검증하지 않았다."

  - id: "F-07e"
    result: "명시적인 PDF 페이지·영역 선택과 정확한 파트/마디/음표 ID·XML snapshot 기반 AI 비교를 추가했다. 잘못된 대상·현재 값·중복·지원하지 않는 변경을 차단하는 테스트를 통과했다."
  - id: "F-07f"
    result: "원본/수정 전후 마디 미리보기, 항목별 승인, 별도 raw XML 버전 저장과 활성 버전 복귀를 구현했다. 저장소 원본 보존·모의 AI·승인/저장/undo 화면 테스트와 piano debug APK build를 통과했다. 실제 기기 native 미리보기는 미검증이다."

