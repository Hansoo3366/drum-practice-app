    result: "Conductor의 BPM·Section을 JamMusicState로 공유한다. Member Viewer는 메트로놈 BPM을 맞추고 Section 표식 마디로 이동한다."
  - id: "M6-09"
    result: "Conductor 메트로놈 Start/Stop을 세션 playing으로 공유한다. Member는 Follow 중일 때 재생 상태를 맞춘다. 박자 시각 합의는 MVP 7이다."
  - id: "M6-10"
    result: "Member는 기본 Follow Conductor ON이다. 수동 페이지·마디 이동 시 FOLLOW OFF가 되고, Return to Live로 현재 합주 위치·음악·재생 상태에 복귀한다."
  - id: "M7-01"
    result: "Count-In을 없음/1/2/4마디로 확장하고 세션 countInBars로 공유한다. Conductor가 바꾸면 Member Follow 시 같은 길이로 시작한다."
  - id: "M7-02"
    result: "Start 시 startAt(UTC, lead 750ms)을 세션에 실어 보낸다. Conductor·Member Viewer는 그 시각까지 기다린 뒤 로컬 메트로놈을 시작한다."
  - id: "M7-03"
    result: "합주 메트로놈은 startAt+BPM으로 절대 step을 계산해 박자 표시와 클릭을 맞춘다. 호스트의 박자표·음표 단위·박별 악센트도 JamMusicState로 공유해 Member가 기본 적용하며, 놓친 step은 건너뛰고 현재 step만 재생한다."
  - id: "M7-04"
    result: "기존 Host Click wire 값은 하위 호환용으로만 남기고, 현재 Jam은 Conductor·Member 모두 공통 startAt과 설정의 로컬 클릭을 재생한다."
  - id: "M7-05"
    result: "Individual Click 선택 UI를 제거하고 Jam 메트로놈 시트에서 BPM·박자표·음표 단위·카운트인·박별 악센트를 호스트가 설정하도록 연결했다. 세트리스트 항목별 리듬 프로필을 저장해 곡 전환 시 복원하며, 같은 Wi-Fi 주변 방 검색과 활성 방 복귀도 Jam 허브에서 제공한다."
  - id: "M7-06"
    result: "Conductor의 A-B Loop를 JamLoopState로 공유한다. Member Follow 시 같은 구간을 켜고, 곡 변경 시 Loop를 지운다."
  - id: "M7-07"
    result: "RTT 기반 clock-ping/pong으로 Conductor↔Member 시계 offset을 추정하고, drift 50ms 이상 시 다음 마디 경계에서 startAt을 보정해 합주 메트로놈 동기화를 강화한다."
  - id: "BUG-DB-001"
    result: "실제 컬럼보다 뒤처진 Drift schema version에서도 addColumn 전에 PRAGMA table_info로 존재 여부를 확인하도록 마이그레이션을 보강했다. Library·Setlist 공통 DB 복구 회귀 테스트를 추가했다."
  - id: "AUDIT-JAM-SETLIST-LOAD-001"
    result: "Jam에서 기존 세트리스트를 공유할 때 live watchItems().first 대신 getItems() 일회성 DB 스냅샷을 사용하도록 바꿨다. 곡 순서·BPM을 포함한 기존 세트리스트 조회 회귀 테스트와 release APK 설치를 확인했다."
  - id: "AUDIT-JAM-MEMBER-SCORE-001"
    result: "Jam 참가자 곡 목록에 곡별 로컬 악보 연결 아이콘을 추가했다. 참가자는 제목·아티스트 후보 또는 전체 Library에서 자기 기기 악보를 선택해 Setlist.id+SetlistEntry.id로 저장하고, 연결된 곡은 같은 아이콘으로 재선택할 수 있다. 호스트의 곡 선택·세트리스트 제어는 그대로 유지한다."
  - id: "AUDIT-ANDROID-TABLET-INSTALL-001"
    result: "Android 태블릿 SM-X620(R54Y600GBKY)에 versionCode 2 release APK를 설치하고 MainActivity와 앱 프로세스 실행을 확인했다. 설치 APK SHA-256이 release 산출물과 일치한다."
  - id: "AUDIT-RESPONSIVE-BRAND-001"
    result: "홈 헤더의 AppBrandMark를 760dp 미만에서만 표시하고, NavigationRail과 동일한 breakpoint를 공유하도록 정리했다. 모바일에는 헤더 아이콘을 유지하고 폴드 펼침·태블릿 넓은 화면에는 rail 아이콘 하나만 남긴다."
  - id: "AUDIT-CLOUD-DEFAULTS-001"
    result: "Google Drive 웹 클라이언트 ID와 Dropbox App Key를 CloudOAuthConfig의 Android 기본값으로 포함하고 build define override를 유지했다. 일반 release 빌드가 두 클라우드에서 시스템 파일 선택기로 fallback하지 않고 앱 내부 OAuth를 시도한다."
  - id: "AUDIT-JAM-SETLIST-LIST-001"
    result: "Jam 세트리스트 선택·복귀 경로가 setlistsProvider.future의 오래된 첫 빈 값을 사용하지 않고 SetlistRepository.getSetlists() 현재 snapshot을 읽도록 수정했다. 기존 목록이 있는데 없다고 표시되는 회귀 경로를 단위 테스트로 확인했다."

  - id: "AUDIT-BPM-001"
    result: "PDF import 서비스의 BPM 검증을 UI·기획 기준인 40~240으로 통일하고 39·241 회귀 테스트를 추가했다."
  - id: "AUDIT-STORAGE-001"
    result: "SongFileStorage.resolve가 앱 문서 루트 밖의 절대·상위 경로를 거부하도록 하고 정상 상대 경로·탈출 경로 회귀 테스트를 추가했다."
  - id: "AUDIT-CLOUD-001"
    result: "OAuth 설정이 없는 Android 빌드에서 Google Drive·Dropbox 선택을 Android 시스템 파일 선택기로 fallback하고, 설정이 있는 빌드에서는 앱 내부 OAuth를 시도하도록 분기했다. 제공된 클라이언트 설정으로 Android release APK를 빌드했다."
  - id: "AUDIT-ANNOTATION-001"
    result: "AnnotationDock의 되돌리기·전체 지우기 아이콘에 명시적인 Viewer 전경색을 적용해 비활성 상태에서도 검은색으로 상속되지 않도록 보정했다."
  - id: "AUDIT-ANNOTATION-INSTALL-001"
    result: "대상 실기기 RFKL40AXPCP(SM-F966N)에 주석 아이콘 대비 보정이 포함된 최신 Android release APK를 재설치하고 실행 Intent를 전달했다."
  - id: "AUDIT-TOOLS-001"
    result: "ToolsScreen의 중복 클라우드 악보(WebDAV) 타일을 제거하고 Library의 추가 > WebDAV에서 가져오기 흐름을 단일 진입점으로 유지했다."
  - id: "AUDIT-TOOLS-INSTALL-001"
    result: "도구 타일 제거를 포함한 최신 Android release APK를 RFKL40AXPCP와 emulator-5554에 재설치하고 양쪽 versionCode 2 갱신을 확인했다."
  - id: "AUDIT-JAM-UI-SYNC-001"
    result: "합주 화면에 Conductor 전용 시작·정지 버튼, 세트리스트 곡명·아티스트·BPM 목록, 참가자 역할·연결 상태·본인 표시를 추가했다. 시작 시 현재 로컬 악보를 열고, JamMusicState에 박자표·음표 단위·악센트를 포함해 Member의 초기 상태와 변경 상태에 적용한다."
  - id: "AUDIT-JAM-INDIVIDUAL-INSTALL-001"
    result: "Individual Click 기본값 변경을 포함한 최신 Android release APK를 emulator-5554에 재설치하고 MainActivity 실행 및 앱 프로세스(실행 PID)를 확인했다."
  - id: "AUDIT-JAM-INDIVIDUAL-INSTALL-002"
    result: "동일 APK를 실기기 RFKL40AXPCP(SM-F966N)에 재설치하고 MainActivity 실행 및 앱 프로세스(실행 PID)를 확인했다."
  - id: "AUDIT-JAM-INDIVIDUAL-INSTALL-003"
    result: "동일 APK를 실기기 R3CX70AFANJ(SM-F741N)에 재설치하고 MainActivity 실행 및 앱 프로세스(실행 PID)를 확인했다."
  - id: "AUDIT-JAM-LAN-DISCOVERY-001"
    result: "두 실기기가 같은 CNX_CIXM Wi-Fi의 192.168.0.0/23에 있고 게스트에서 호스트 TCP 47828이 연결됨을 확인했다. UDP 제한 브로드캐스트만 실패하는 경로를 기준으로 LanJamSessionStore가 인터페이스 주소에서 192.168.1.255 directed broadcast를 계산해 전송하도록 보강했고, Jam 테스트 47개·analyze를 통과한 release APK를 RFKL40AXPCP와 R3CX70AFANJ에 재설치했다."
  - id: "AUDIT-JAM-LAN-SEND-ROBUST-001"
    result: "일부 네트워크 인터페이스의 broadcast 주소가 라우팅되지 않아 udp.send가 예외를 내던 회귀를 주소별 try/catch로 격리했다. 전체 flutter test 140개와 analyze를 통과하고 최종 release APK를 RFKL40AXPCP와 R3CX70AFANJ에 재설치했다."
  - id: "AUDIT-JAM-DEFENSIVE-001"
    result: "네트워크 미연결·UDP 소켓 비동기 오류·호스트 TCP/세션 종료를 방어하고, 인터페이스 직접 전송·단일 discovery 소켓의 120ms 재시도와 20ms 초기 지연으로 브로드캐스트 누락을 복구하며, 실패 원인별 안내 문구를 추가했다. 호스트 UDP listener 구독을 명시적으로 보관하고 종료 시 구독·소켓을 순서대로 정리한다. Jam 허브의 생성·참가·QR 참가 버튼은 연결이 끝날 때까지 로딩·중복 입력 차단을 표시하며, 호스트 종료 시 게스트가 종료 안내와 합주 목록 복귀 버튼을 본다. Jam 테스트 51개와 전체 테스트 144개를 통과했다."
  - id: "AUDIT-JAM-SETLIST-IDENTITY-001"
    result: "JamSharedSetlist가 로컬 Song.id 대신 SetlistEntry.id를 entryId로 공유하도록 Memory/LAN 세션과 JSON을 정리했다. 각 Android 기기는 세트리스트 UUID+entryId별 로컬 Song.id를 SharedPreferences에 저장하고, 최초 선택·재선택 UI와 이후 자동 열기를 제공한다. mapper·세션 전환·후보 정렬 회귀 테스트를 포함한 전체 143개 테스트와 analyze를 통과했다."
  - id: "AUDIT-JAM-PART-001"
    result: "Jam 생성·참가 payload에 악기 파트와 기타 직접 입력을 추가하고, 기존 payload는 드럼 기본값으로 복원한다. 허브 다이얼로그에서 보컬·기타·베이스·드럼·키보드·기타를 아이콘과 함께 고르며 세션 참가자 카드에 파트·Conductor/Member·연결 상태를 표시한다. 호스트 세트리스트 선택 버튼에는 로딩·중복 입력 차단·4초 timeout·오류 안내를 추가했다. 관련 Memory/LAN 회귀 테스트와 전체 144개 테스트, release 빌드·연결 기기 설치를 통과했다."
  - id: "AUDIT-JAM-LOBBY-001"
    result: "JamParticipant에 ready 상태와 LAN ready 메시지를 추가하고, 멤버가 준비 완료를 직접 표시하면 호스트가 준비된 연결 멤버만 시작하도록 방어한다. 호스트 시작 상태는 참가자 화면에서 현재 로컬 악보를 열고 공통 startAt으로 메트로놈을 시작하며, 이미 열린 악보는 중복 라우팅하지 않는다. 세션 상단에 대기실·코드·인원·역할을 표시하고 참가자 준비 칩과 큰 준비/시작 버튼을 추가했다. 세트리스트 선택·악보 매핑 팝업은 제목·패딩·카드 높이를 늘렸고, 호스트가 세트리스트 편집 화면에서 곡을 추가하면 돌아와 공유 스냅샷을 갱신한다. 세트리스트가 없을 때 새로 만든 최신 목록을 돌아오는 즉시 공유한다. 전체 144개 테스트, analyze 결과 기존 경고 4개, Android release 빌드와 R3CX70AFANJ·RFKL40AXPCP·emulator-5554 설치를 확인했다."
  - id: "AUDIT-JAM-SETLIST-DOWNLOAD-001"
    result: "Member가 호스트의 공유 Setlist를 자신의 Drift Setlists에 자동 저장하도록 추가했다. 공유 entryId·제목·아티스트·BPM·순서를 유지하고, 자기 Library에 매칭되는 곡은 즉시 연결하며 없는 곡은 jam_pending 대기 항목으로 보존한다. 세트리스트 저장소 회귀 테스트를 통과했다."
  - id: "AUDIT-JAM-SCORE-SOURCE-001"
    result: "Jam 곡별 연결 버튼에 기존 Library·기기·Google Drive·Dropbox·WebDAV 소스 선택을 추가했다. 기기·클라우드 PDF는 기존 PdfImportService/CloudBrowser를 통해 Library에 저장하고, WebDAV 악보는 기존 RemoteScoreService 등록 결과를 반환해 해당 SetlistEntry에 연결한다. PDF import 결과 ID와 cloud browser 결과 타입을 공통 흐름으로 연결했다."
  - id: "AUDIT-JAM-WEBDAV-SELECT-001"
    result: "Jam 전용 WebDAV 선택 모드에서 새 원격 악보를 Library에 등록한 뒤 즉시 다운로드하고, 이미 등록된 Cloud Only 악보도 선택 시 오프라인 파일로 확보하도록 보강했다. 일반 Library WebDAV 등록 동작은 유지한다."
  - id: "AUDIT-JAM-HOST-SCORE-FALLBACK-001"
    result: "Jam에서 기기별 로컬 악보를 먼저 열고, Member에게 로컬 오프라인 악보가 없으면 필요한 entry의 PDF만 LAN 요청·응답으로 받아 jam_host 임시 Song으로 캐시한다. 임시 악보는 Library에 숨기고 세션 화면 종료·다음 Jam 진입 시 정리하며 Viewer 주석 편집을 잠근다."
  - id: "AUDIT-JAM-METRONOME-ROOMS-001"
    result: "Jam 화면의 Individual Click 선택을 제거하고 공통 메트로놈 설정 시트에서 BPM·박자표·음표 단위·카운트인·박별 악센트를 호스트가 변경하도록 연결했다. Jam 허브에는 활성 방 복귀 카드와 UDP 기반 같은 Wi-Fi 주변 방 탐색·참가 목록을 추가하고, announce에 방 제목·참가 인원을 포함했다."
  - id: "AUDIT-SETLIST-EDGE-NAV-001"
    result: "일반 세트리스트 Viewer도 마지막·첫 페이지에서 좌우 페이지 이동을 계속하면 setlistId의 다음·이전 오프라인 곡으로 pushReplacement하도록 수정했다. Stage 전용 제한 때문에 곡 전환이 막히던 경로를 제거했다."
  - id: "AUDIT-LAN-DISCOVERY-ROUTE-001"
    result: "NetworkInterface 주소만으로 directed broadcast를 추정하던 경로와 불필요한 주기 방송을 제거해 라우팅되지 않는 주소가 UDP listener를 닫지 않도록 했다. 호스트는 query에만 announce로 응답하고 LAN discovery/코드 참가 수신기는 한 read 이벤트에서 대기 datagram을 모두 처리한다. 주변 방 탐색을 12회 반복하고 전체 152개 테스트를 통과했다."
  - id: "AUDIT-JAM-PER-SONG-METRONOME-001"
    result: "SetlistEntries에 DB v16 nullable metronome_json을 추가해 곡별 BPM·박자표·음표 단위·박별 악센트를 저장한다. 기존 tempoOverride/BPM-only 항목과 구형 Jam payload는 하위 호환하고, Jam 곡 전환 시 프로필을 적용하며 호스트 변경은 현재 entry에 갱신한다. 관련 저장소·Memory/LAN·JSON 회귀를 포함한 전체 154개 테스트, release build, 연결 Android 3대 설치를 확인했다."
  - id: "AUDIT-JAM-PER-SONG-METRONOME-002"
