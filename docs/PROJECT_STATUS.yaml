  - id: "AUDIT-METRONOME-BOUNDARY-001"
    result: "MetronomeSequence와 MetronomeSettings의 BPM·연음·박자표·Count-In·악센트·마디 순환·절대 step·음수·구형/손상 JSON 경계를 테스트하고 40~240·1~6·1~12 범위로 안전하게 보정했다."
  - id: "AUDIT-METRONOME-PLAYBACK-001"
    result: "MetronomeClickPlayer의 중복 시작·정지·곡 전환 중 남은 voice·비동기 stale 재생 요청을 무효화하고 Count-In 1~12 음성 자산을 시작 전에 선행 로드하도록 보강했다. 메트로놈 화면과 Tempo Trainer·Score Viewer 정지 경로가 공통 stop을 사용한다."
  - id: "AUDIT-ANNOTATION-ROBUST-001"
    result: "AnnotationStroke가 malformed/non-finite 좌표·색·선 굵기·투명도를 예외 없이 건너뛰거나 범위 보정하도록 하고 회귀 테스트를 추가했다. 기존 pdfrx 페이지 오버레이 구조는 유지했다."
  - id: "AUDIT-METRONOME-LIBRARY-001"
