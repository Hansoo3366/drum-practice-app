  - id: "AUDIT-JAM-FOLLOW-SONG-001"
    result: "Jam 참가자 Viewer가 이미 이전 악보 라우트를 열고 있어도 세션 currentEntryId가 바뀌면 새 곡을 자동으로 연다. 같은 곡 재시작이나 메트로놈 상태 갱신에는 중복 라우팅하지 않는다."
