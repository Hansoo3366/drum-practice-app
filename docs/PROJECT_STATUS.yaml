summary: "OMR 95% 목표를 우선해 실제 코드를 개선한다. 코드 적용 괄호·확장음 회귀 수정에 이어, book에 읽힌 음표가 voice/slot 계산 실패로 내보내지지 않는 문제와 s17의 누락 4/4를 수정했다. 단선 보표에서 명시적 기호·마디 음가 합계·기존 음표가 모두 일치할 때만 별도 보정본으로 복원하며 낮은 확신도·다성부·잇단음표는 차단한다. 같은 17곡 766마디·book/AI 응답 고정 재생 out5는 500→512→519 완전 일치(65.3→66.8→67.8%), 음표 수 오류 134→121, 가사 오류 366→341/2821(87.9%), 기존 정답 추가 회귀 0. 새 종단간 전체 측정은 아니며 95% 미달(728마디까지 추가 209). 서버 157·게이트 6 테스트 통과. 단선 성부 번호 불연속·rhythm/time 이력도 수정했다. 합쳐진 44마디, 음높이/음가 전체 정답·독립 표본, 실기기/클라우드 QA는 미완료다. 앞선 앱 QA 679 통과·1 건너뜀과 반주 제거·악기 단일 생성은 유지한다. 출시 준비 완료로 판정하지 않는다."

