summary: "F-07에 원본 PDF 마디와 AI 제안을 대조하는 승인 보정 흐름을 추가했다. 사용자가 파트·마디·PDF 페이지·영역을 지정하고 전송을 확인한다. AI 제안은 정확한 XML snapshot과 음표 식별자에 묶이며 음높이·단순 음가만 적용한다. Verovio 수정 전후 미리보기, 항목별 승인, 이름 있는 별도 raw XML 버전 저장과 이전 버전 복귀를 연결했다. 원본 PDF/MusicXML과 코드·가사·지시를 보존한다. 테스트·piano debug APK build는 통과했으나 실제 AI 호출·기기 PDF 조작·미리보기·정확도·비용은 미검증이다. 서버와 update.sh는 이번 작업에서 변경하지 않았다. 구조 점수는 계속 원본 변환본 기준이다."

