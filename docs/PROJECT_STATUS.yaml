  - id: "M8-01"
    result: "기존 PDF의 각 페이지를 렌더링해 정규화 펜·지우개 stroke를 별도 투명 레이어에서 합성하고, 원본 PDF와 편집 가능한 주석 JSON을 보존한 채 새 평면화 PDF로 저장하는 흐름을 Viewer 설정에 추가했다. 색상 펜·지우개 원본 보존·파일명·잘못된 픽셀 입력을 회귀 테스트로 확인했다."
  - id: "M8-02"
    result: "MusicXML 4.0 score-partwise 기반 내부 Score Document와 MusicXML/MXL 코덱을 구현했다. 피아노 다중 staff·voice·chord 타이밍과 주요 기호를 파싱한다. Library 가져오기는 `.musicxml`·`.mxl`·`.xml`을 지원하고 원본 형식을 유지한다. 사용자 내보내기는 MusicXML(.musicxml)로 통일하며 MXL 경로·크기·엔트리 제한은 가져오기와 프로젝트 원본에 유지한다."
  - id: "M8-03"
    result: "기반 구현으로 verovio_flutter 0.3.3 FFI를 통해 상류 Verovio 6.2.1 네이티브 엔진을 사용한다. 내부 MusicScore를 MusicXML로 직렬화하고 Verovio SVG와 HitMap을 받아 화면에 표시한다. 연습 화면은 A4 종이·레터박스·페이지 나눔 없는 화면 폭 기준 연속 세로 문서이며 HitMap 기반 좌표를 마디 강조·입력·음표 선택에 공유한다. 2026-09-25 의존성 복구 후 Verovio 대상 analyze와 관련 테스트, piano/drum debug APK build가 통과했다. 실기기 입력·대형 악보·출시 품질 smoke는 roadmap에서 계속 진행한다."
  - id: "M8-04"
    result: "기반 Dart Score Document와 Verovio 입력 경로에 불변 snapshot, 최대 100단계 undo/redo, 음표·쉼표·조표·박자표·마디 편집, 공유 staff geometry, onset anchor, 고스트 입력, 버전 저장을 구현했다. Lomse FFI 커스텀 editor 수직 슬라이스에 cursor note/rest 삽입·MusicXML export·Undo/Redo·Verovio 재렌더링을 연결했으며, mapping·전체 command·fixture 왕복·대형 악보 성능은 M8-10 production gate로 남아 있다."
  - id: "M8-05"
    result: "alphaTab 1.8.4 MIDI 합성기와 FreePats YDP 그랜드 피아노 SoundFont를 앱 자산으로 고정했다. 재생·일시정지·정지·탐색과 Bar/Beat Cursor는 같은 플레이어 타임라인을 사용하며, 기존 flutter_soloud 메트로놈/오디오 엔진과 별도의 Dart 음원 타이머는 쓰지 않는다. 악보 터치로 Web Audio를 열고, SoundFont 준비 전에 누른 재생은 준비되면 이어 받는다."
  - id: "M8-06"
    result: "Section 구조 패널을 DigitalScoreScreen에 연결해 선택 마디의 시스템 범위에 INTRO/VERSE/PRE/CHORUS/BRIDGE/OUTRO를 지정하고, 반복 횟수·순서·삭제를 Playback Sequence sidecar에 저장할 수 있게 했다. Verovio SVG에서 제거한 텍스트를 보완하기 위해 Section 표식은 Flutter 오버레이로 표시한다. 저장된 sequence·arrangement를 화면·내보내기 경로에 전달하며, 실기기 저장·재열기 smoke는 진행 중이다."
  - id: "M8-07"
    result: "반음(-24~24) 또는 목표 조로 음표·harmony·keyFifths를 한 명령으로 이조한다. 도착 조의 음이름 표기를 쓰고 같은 소리의 다른 조표(C♯/D♭)를 고를 수 있으며, 변경은 undo 가능한 편집본과 Grand Staff·재생 타임라인에 바로 반영한다."
  - id: "M8-08"
    result: "harmony 진행에서 코드·박마다·하나씩 피아노 반주를 만들고 프로필만 `arrangement_profiles/<songId>.json`에 저장한다. 코드 심벌이 없으면 반주를 적용하지 않고 `코드 없음`만 보여 준다. 원본 음표는 유지하고, 편집이 꺼져 있을 때 펼친 Sequence 위에 생성 반주를 올려 Grand Staff와 재생 타임라인에 연결한다."
  - id: "M8-09"
    result: "내려받기 메뉴에서 PDF·MusicXML·프로젝트·MIDI 네 형식만 제공한다. MusicXML·MIDI·PDF는 펼친 Sequence와 반주를 반영하고, 프로젝트 zip은 편집 원본과 Sequence·반주 sidecar를 담는다. 원본은 덮어쓰지 않으며 Android 파일 재열기는 B-017로 남아 있다."
