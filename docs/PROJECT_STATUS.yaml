    date: "2026-10-01"
    status: "active"
    decision: "내보내기는 버전의 파일에서 만든다(편집 중이거나 재생용 반주를 켠 경우만 예전처럼 편집 모델에서). MusicXML은 파일 원문에 사용자의 구간 이름을 연습 기호로 넣은 것, 순서를 정했으면 그 순서로 펼친 것. MIDI는 재생과 같은 시퀀스에 채널별 악기를 넣은 것. PDF는 뷰어와 같은 Verovio 조판을 A4로 다시 떠서 글자(가사·코드·마디 번호·구간 이름)를 SUIT TTF로 얹은 것. pdf 패키지가 OTF(CFF)를 유니코드로 내장하지 못해 SUIT-Regular.ttf를 자산에 추가했다."
  - id: "D-196"
    date: "2026-10-01"
    status: "superseded_by_D-218"
    decision: "악기별 악보는 리드시트(멜로디+코드)를 구간 역할에 따라 각 악기의 연주 방식으로 다시 쓴 것이다. 역할은 구조 패널의 구간 이름에서 읽고(영어·한국어·연습 기호), AI 추천이 있으면 그 역할로 덮는다. 기본 결과는 악기마다 따로 된 버전(위에 멜로디·가사·코드, 아래에 그 악기 파트)이며 한 악보에 모두 넣는 합주 총보도 고를 수 있다. 음표는 규칙이 쓰고 AI는 역할·스타일·코드 교정만 추천한다."
  - id: "D-195"
    date: "2026-10-01"
    status: "active"
    decision: "악기별 음색은 flutter_notemus의 네이티브 시퀀서를 고쳐서 낸다. 패키지를 third_party/flutter_notemus로 가져와 dependency_overrides로 쓰고, TinySoundFont(MIT)로 SoundFont를 재생한다. 음원은 GeneralUser GS v2.0.3(31MB)를 piano flavor에만 넣는다. 악기는 파트의 MusicXML midi-program을 따르고(없으면 피아노, 노래 파트는 피아노로 대신), 첫 파트 아래의 파트는 반주로 보고 작게 낸다. 음원을 읽지 못하면 원래의 파형으로 재생한다."
  - id: "D-194"
    date: "2026-10-01"
    status: "active"
    decision: "사용자 결정(\"안내 문장만 번역하라니까 악보 안에 용어도 다 번역했네\")으로 피아노 앱의 한국어는 안내 문장·버튼·메뉴에만 쓴다. 악보에 그려지는 음악 용어(구간 이름 Intro·Verse·Chorus 등, 악기 파트 이름 Piano·Strings 등)는 영어 그대로 둔다."
  - id: "D-193"
    date: "2026-10-01"
    status: "active"
    decision: "악기별 반주 파트의 규칙: 오르간은 피아노와 같은 음역의 화음+베이스를 붙임줄로 이어 누른다(코드 기호가 다시 적힌 마디, 도돌이·엔딩·겹세로줄에서는 다시 침). 스트링은 맨 위 음 G4~A5의 화음+베이스를 같은 방식으로 지속. 패드는 한 보표, 맨 위 음 B3~B4의 지속 화음. 브라스는 한 보표 3성(맨 위 음 F4~G5)으로 코드마다 한 박만 치고 쉰다. 모든 악기가 멜로디 아래에 둘 수 있으면 아래에 두고, 멜로디와 반음으로 부딪히는 음은 뺀다. 패턴·음역 선택과 AI 구간 추천은 피아노 파트에만 적용한다. 악기 이름은 파트 첫 마디 위 글자로 적는다(앱이 파트 이름을 그리지 않으므로). 악기가 피아노 하나뿐이면 적지 않는다."
  - id: "D-192"
    date: "2026-10-01"
    status: "active"
    decision: "만든 피아노 파트의 스타일은 버전 목록이 아니라 MusicXML 파일 안(identification/miscellaneous의 page-a-diddle:piano-part)에 기록한다. 교정·조옮김·펼친 사본으로 버전이 바뀌어도 따라가고, 교정 저장 때 그 기록으로 피아노 파트를 다시 만든다."
  - id: "D-191"
    date: "2026-10-01"
    status: "active"
    decision: "사용자 결정(\"앱 언어 한국어로 기본으로 해줄래? 다른 언어는 필요없을듯\")으로 피아노 앱은 한국어만 쓴다. 기기 언어와 관계없이 ko로 고정하고 설정의 언어 선택을 숨긴다. 배포 중인 드럼 앱의 언어 5종은 그대로 둔다. 피아노 앱에는 ja·zh·la 번역이 필요 없다."
  - id: "D-190"
    date: "2026-10-01"
    status: "active"
    decision: "사용자 결정(\"그 방식으로 하는게 토큰도 아끼고 낫겠다 해봐\")으로 반주 음표는 규칙이 쓰고 AI는 추천만 한다. 앱이 곡을 글(조·박자·구간·마디별 코드와 멜로디 음)로 요약해 서버 /arrange/advice에 한 번 보내고(이미지 없음), 모델은 전체·구간별 반주 스타일(held·beats·broken, middle·low)과 잘못 읽힌 듯한 코드 기호를 JSON으로 답한다. 서버와 앱이 각각 답을 검증해 악보에 맞지 않는 항목을 버리고, 코드 교정은 사용자가 체크한 것만 새 버전에 반영한다."
  - id: "D-189"
    date: "2026-10-01"
    status: "active"
    decision: "3단 변환은 원본 XML의 멜로디 파트를 그대로 두고 피아노 파트(2보표)를 두 번째 `<part>`로 덧붙여 새 버전으로 저장한다. 오른손은 코드 기호의 화음을 가운데 도 주변(맨 위 음 C4~D5)에 밀집 배치로, 앞 화음과 가장 가까운 자리바꿈으로 놓고 멜로디가 충분히 높으면 그 아래에 둔다. 왼손은 베이스(분수 코드면 그 베이스)를 E2~E♭3에 둔다. 마디마다 다시 치고 다음 코드 기호까지 잇는다. N.C.와 첫 코드 이전은 쉼표. 반주 리듬·밀도·음역 조절은 F-08c로 미룬다."
  - id: "D-188"
    date: "2026-10-01"
    status: "active"
    decision: "재생 MIDI는 flutter_notemus의 읽기 한계(1번이 아닌 성부 누락, forward 무시, 박자표 기준 마디 배치, 붙임줄 처리)를 MIDI 전용 XML 사본에서 보정해 만든다(`playbackMidi`). 화면의 악보와 저장 파일은 건드리지 않는다. 음표 수정에서 코드 기호는 음이 덮여도 `<offset>`으로 제 박에 남긴다."
  - id: "D-187"
    date: "2026-10-01"
    status: "active"
    decision: "조옮김은 원본 XML을 직접 바꿔(음높이·조표·코드·임시표만) 항상 새 버전으로 저장하고, 재생 MIDI는 화면의 원본 XML을 연주 순서대로 펼친 파일로 만든다. 코덱 재인코딩은 셋잇단·아티큘레이션·줄바꿈을 잃으므로 파일 수준 작업(저장·재생)에는 쓰지 않는다. 사용자 요구: 검증에서 이슈가 하나라도 남으면 안 된다."
  - id: "D-186"
    date: "2026-10-01"
    status: "active"
    decision: "사용자 결정(\"번역은 최 후순위\")으로 ja·zh·la 번역 누락은 가장 마지막에 처리한다."
  - id: "D-185"
    date: "2026-09-30"
    status: "active"
    decision: "사용자 결정(\"3-1-2-4 순서로 하자\")으로 검토 후속 작업을 임시 코드 정리 → 재생 순서 로직 → 패널 UI → 큰 파일 나누기 순서로 진행한다. 재생 순서 로직에서는 사용자 순서도 엔딩을 따르고(마지막 판은 마지막 엔딩), 재생·재생 헤드·연주용 버전이 모두 performanceMeasureMap 하나를 쓴다. 같은 버전·같은 순서의 연주용 버전은 다시 만들지 않고 연다."
  - id: "D-184"
    date: "2026-09-30"
    status: "active"
    decision: "사용자 결정(\"gpt로만 테스트하자 한도 늘려놨어, gemini 는 선불이 귀찮네\")으로 서버 AI 검수는 GPT-5.6 Terra만 쓴다(서버 /etc/default/omr OMR_AI_MODEL=gpt-5.6-terra). 코드 제안과 음절 수가 음표 수와 같은 가사 제안만 'AI 보정' 버전에 적용하고, 음표 제안은 표시만 한다."

